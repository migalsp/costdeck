# Schema-less stand-ins for the CloudNativePG, Zalando postgres-operator and Strimzi CRDs,
# for tests that check how hibernate rules stop and start their resources (envtest in
# internal/controller, hack/e2e/94-hibernate.sh). No operator runs: status is part of the
# object here, so tests play the operator by setting it directly.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusters.postgresql.cnpg.io
spec:
  group: postgresql.cnpg.io
  names: {kind: Cluster, listKind: ClusterList, plural: clusters, singular: cluster}
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresqls.acid.zalan.do
spec:
  group: acid.zalan.do
  names: {kind: postgresql, listKind: postgresqlList, plural: postgresqls, singular: postgresql}
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkaconnects.kafka.strimzi.io
spec:
  group: kafka.strimzi.io
  names: {kind: KafkaConnect, listKind: KafkaConnectList, plural: kafkaconnects, singular: kafkaconnect}
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkamirrormaker2s.kafka.strimzi.io
spec:
  group: kafka.strimzi.io
  names: {kind: KafkaMirrorMaker2, listKind: KafkaMirrorMaker2List, plural: kafkamirrormaker2s, singular: kafkamirrormaker2}
