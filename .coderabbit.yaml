# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: chill
  high_level_summary: true
  poem: false
  sequence_diagrams: false
  review_status: true
  collapse_walkthrough: true

  path_filters:
    - "!docs/assets/**"
    - "!CHANGELOG.md"

  path_instructions:
    - path: "**/zz_generated.*.go"
      instructions: |
        Generated by controller-gen (`make generate`): do not review.
    - path: "config/crd/bases/**"
      instructions: |
        Generated by controller-gen (`make manifests`): do not review.
    - path: "config/rbac/role.yaml"
      instructions: |
        Generated by controller-gen (`make manifests`): do not review.
    - path: "deploy/helm/costdeck-operator/templates/crd.yaml"
      instructions: |
        Generated from the CRDs by `make manifests`: do not review.
    - path: "deploy/helm/costdeck-operator/templates/rbac-roles.yaml"
      instructions: |
        Generated from the RBAC markers by `make manifests`: do not review.
    - path: "PROJECT"
      instructions: |
        Kubebuilder metadata: do not review.
    - path: "ui/package-lock.json"
      instructions: |
        Lockfile written by npm: do not review it line by line.
    - path: "**/*.go"
      instructions: |
        Logging follows the Kubernetes style that logcheck enforces: a capitalized message with
        no trailing period, past tense for completed actions, balanced key/value pairs.
        Settings are read with internal/config.Get from the CostDeckConfig named default in the
        operator namespace; credentials live in Secrets referenced by *SecretRef fields, never in
        the custom resource. Secrets and ConfigMaps are only read in the operator namespace.
        HTTP handlers use writeJSON, writeError, decodeJSON and writeObject/writeObjects.
        Outbound HTTP and SMTP to addresses users configure (webhooks, SMTP, other clusters) go
        through internal/netguard, which refuses link-local and cloud metadata addresses.
        Flag behaviour changes that have no unit test and no scenario in hack/e2e.
    - path: "api/v1/**"
      instructions: |
        Type or marker changes need the output of `make manifests generate` in the same pull
        request (CRDs, RBAC, deepcopy, Helm CRD and RBAC templates); CI fails otherwise. A new CRD
        must also be listed in config/crd/kustomization.yaml.
    - path: "internal/scaling/**"
      instructions: |
        When a schedule is up is defined once in internal/scaling/testdata/windows.json, which the
        Go tests and ui/src/lib/schedule.test.ts both run, so the UI cannot drift from the
        operator. Planning logic is tested table-driven, without a cluster. Use
        ScalingGroup.Members(), never spec.namespaces alone.
    - path: "hack/e2e/**"
      instructions: |
        Scripts run under macOS bash 3.2 too: no associative arrays, JSON bodies built in plain
        assignments, never a quoted JSON body inside "$(...)". Scenario variables are globals
        shared with later scenarios, so names must not repeat; NS, RELEASE and HERE are taken.
        Ordering is made observable with the deployment helper and holds_for, never with sleeps.
        Under pipefail, never pipe a stream into grep -q; read it whole first.
    - path: "ui/src/**"
      instructions: |
        Response types in ui/src/lib/types.ts mirror the Go JSON tags. Poll with usePolling. Move
        between pages with navigate or followLink, never with page state. Outcomes of actions go
        through toast; destructive actions get an inline Confirm/Cancel step. Settings forms use
        components/settings/fields.tsx. A UI fix comes with a Vitest test that fails without it.
    - path: ".github/workflows/**"
      instructions: |
        Every action is pinned by full commit SHA with its version in a trailing comment, every
        checkout sets persist-credentials: false, permissions stay at the least each job needs,
        and no ${{ }} expression is expanded inside a run script: pass it through env instead.
    - path: "deploy/helm/**"
      instructions: |
        Optional features get their own ClusterRole in a hand-written template behind a value,
        off by default. crd.yaml and rbac-roles.yaml are generated by `make manifests`.

  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "dependabot[bot]"
      - "github-actions[bot]"
    ignore_title_keywords:
      - "chore(main): release"

  tools:
    golangci-lint:
      enabled: false
    eslint:
      enabled: false

chat:
  auto_reply: true
