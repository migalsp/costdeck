              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ScalingGroup
            properties:
              active:
                description: |-
                  Active is the manual override for scaling.
                  If null, the schedule is followed.
                  If true, the group is forced to Scale Up.
                  If false, the group is forced to Scale Down.
                type: boolean
              activeUntil:
                description: |-
                  ActiveUntil bounds the manual override in time. When set, Active is honoured only
                  until this timestamp; afterwards the schedule takes over again without anyone having
                  to clear the override by hand. Ignored when Active is null.
                format: date-time
                type: string
              category:
                description: Category is the group classification (e.g. Solution,
                  Platform)
                type: string
              externalTargets:
                description: ExternalTargets allows you to manage 3rd party cloud
                  resources alongside Kubernetes resources.
                items:
                  description: ExternalTarget represents a 3rd party resource to scale
                  properties:
                    executeAfter:
                      description: ExecuteAfter specifies which namespace stage this
                        resource should scale after
                      type: string
                    identifier:
                      description: Identifier is the unique ID or ARN of the resource
                      type: string
                    name:
                      description: Name is a human-readable name for the resource
                        (e.g. EC2 "Name" tag)
                      type: string
                    provider:
                      description: Provider is the cloud provider (e.g., "aws", "gcp",
                        "azure")
                      type: string
                    region:
                      description: Region where the resource resides
                      type: string
                    status:
                      description: Status tells you if the DB is available or stopped
