---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: scalinggroups.finops.costdeck.io
spec:
  group: finops.costdeck.io
  names:
    kind: ScalingGroup
    listKind: ScalingGroupList
    plural: scalinggroups
    singular: scalinggroup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.mode
      name: Mode
      type: string
    - jsonPath: .spec.dependsOn
      name: Depends on
      priority: 1
      type: string
    - jsonPath: .status.desiredState
      name: Desired
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.namespacesReady
      name: Ready
      type: integer
    - jsonPath: .status.namespacesTotal
      name: Total
      priority: 1
      type: integer
    - jsonPath: .status.nextTransition.time
      name: Next change
      type: string
    - jsonPath: .status.estimatedHourlySavings
      name: Saving/h
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: ScalingGroup is the Schema for the scalinggroups API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ScalingGroup
            properties:
              activation:
                description: |-
                  Activation decides what drives this group's own desired state.
                  Schedule (default): spec.schedules and spec.active; dependents can additionally
                  keep the group up. OnDemand: the group has no schedule of its own and is up only
                  while a group that depends on it needs it (or a manual override forces it).
                enum:
                - Schedule
                - OnDemand
                type: string
              active:
                description: |-
                  Active is a manual override. While it is set the schedule is ignored completely:
                  true forces the group up, false forces it down. Remove the field (null) to return
                  to the schedule, or set ActiveUntil so that happens automatically.
                  status.mode shows which of the two is in control.
                type: boolean
              activeUntil:
                description: |-
                  ActiveUntil bounds the manual override in time. When set, Active is honoured only
                  until this timestamp; afterwards the schedule takes over again without anyone having
                  to clear the override by hand. Ignored when Active is null.
                format: date-time
                type: string
              calendars:
                description: |-
                  Calendars names shared holiday calendars (CostDeckConfig spec.calendars) whose days
                  apply as exceptions too.
                items:
                  type: string
                maxItems: 10
                type: array
                x-kubernetes-list-type: set
              category:
                description: Category is the group classification (e.g. Solution,
                  Platform)
                type: string
              dependsOn:
                description: |-
                  DependsOn lists ScalingGroups (in the same namespace) this group needs, for example
                  a shared platform. This group only starts scaling up once every dependency reports
                  ScaledUp. In turn, a dependency is kept up while any group that depends on it wants
                  to be up, and is only scaled down after all of its dependents are fully down.
                  A manual override on the dependency itself still wins.
                items:
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: set
              dryRun:
                description: |-
                  DryRun works out what the schedule would do and reports it (phase DryRun and the
                  DryRun condition) without scaling anything, to try a schedule before it acts. To the
                  schedules that depend on it, a group in dry run counts as up.
                type: boolean
              exceptions:
                description: Exceptions override the schedules on given dates (holidays,
                  release weekends).
                items:
                  description: |-
                    ScheduleException overrides the weekly schedules on given dates: a public holiday the
                    environment stays down, or a release weekend it stays up. A manual override (spec.active)
                    still beats it. When exceptions overlap, the one that began last wins, so a release
                    weekend inside a holiday break keeps the environment up.
                  properties:
                    end:
                      description: |-
                        End is the last day it applies (the whole day) or the moment it stops applying.
                        Defaults to the end of the Start day.
                      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T([01][0-9]|2[0-3]):[0-5][0-9])?$
                      type: string
                    name:
                      description: Name says what the exception is for, such as "New
                        Year" or "Release 2.4".
                      maxLength: 100
                      type: string
                    start:
                      description: Start is the first day ("2026-12-24") or the moment
                        ("2026-12-24T18:00") it applies.
                      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T([01][0-9]|2[0-3]):[0-5][0-9])?$
                      type: string
                    state:
                      description: State the target is kept in while the exception
                        applies.
                      enum:
                      - Up
                      - Down
                      type: string
                    timezone:
                      description: |-
                        Timezone of Start and End (e.g. "Europe/Berlin"). Defaults to the timezone of the
                        first schedule, then to UTC.
                      type: string
                  required:
                  - start
                  - state
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-type: atomic
              externalTargets:
                description: ExternalTargets allows you to manage 3rd party cloud
                  resources alongside Kubernetes resources.
                items:
                  description: ExternalTarget represents a 3rd party resource to scale
                  properties:
                    executeAfter:
                      description: ExecuteAfter specifies which namespace stage this
                        resource should scale after
                      type: string
                    identifier:
                      description: Identifier is the unique ID or ARN of the resource
                      type: string
                    name:
                      description: Name is a human-readable name for the resource
                        (e.g. EC2 "Name" tag)
                      type: string
                    provider:
                      description: Provider is the cloud provider (e.g., "aws", "gcp",
                        "azure")
                      type: string
                    region:
                      description: Region where the resource resides
                      type: string
                    status:
                      description: Status tells you if the DB is available or stopped
                        (populated at runtime by UI/Discovery API)
                      type: string
                    type:
                      description: Type of the resource (e.g., "aurora", "cloudsql")
                      type: string
                  required:
                  - identifier
                  - provider
                  - region
                  - type
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              featureFlags:
                description: FeatureFlags holds optional feature toggles for this
                  scaling group
                properties:
                  skipOnTimeout:
                    description: |-
                      SkipOnTimeout if true, a stage that does not reach the target state within
                      TimeoutMinutes stops holding back the next stage. Its namespaces keep being
                      reconciled and are listed in status.skippedNamespaces until they get there.
                      Default: false (each stage waits until all of its namespaces are at the target state)
                    type: boolean
                  timeoutMinutes:
                    default: 5
                    description: TimeoutMinutes is how long each stage may take when
                      SkipOnTimeout is true.
                    maximum: 30
                    minimum: 1
                    type: integer
                type: object
              hibernate:
                description: |-
                  Hibernate stops services that operators run, such as databases, in every namespace of
                  the group, after its workloads, and starts them before; the rules of a namespace's own
                  ScalingConfig add to these. Needs hibernation.enabled in the Helm chart.
                items:
                  description: |-
                    HibernateRule stops services an operator runs in a namespace, such as a database, together
                    with the namespace's workloads: they stop after the workloads and start before them. A
                    preset covers a known operator; otherwise apiVersion, kind and replicasField describe the
                    resources. Only what CostDeck stopped is started again.
                  properties:
                    apiVersion:
                      description: |-
                        APIVersion and Kind of the resources a rule without a preset stops, such as
                        redis.example.com/v1 Redis.
                      type: string
                    kind:
                      type: string
                    names:
                      description: |-
                        Names limits the rule to resources with these names; globs such as "pg-*" work.
                        Empty means every matching resource in the namespace.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    preset:
                      description: |-
                        Preset is a built-in rule: cnpg (CloudNativePG clusters, by declarative hibernation),
                        zalando-postgres (Zalando postgres-operator clusters, numberOfInstances to zero) or
                        strimzi (Strimzi KafkaConnect, KafkaMirrorMaker2 and KafkaBridge; Kafka clusters
                        themselves cannot be stopped).
                      enum:
                      - cnpg
                      - zalando-postgres
                      - strimzi
                      type: string
                    readyField:
                      description: |-
                        ReadyField is the dotted path of the ready replica count in the status, such as
                        status.readyReplicas. Without it a resource counts as stopped or started once patched.
                      type: string
                    replicasField:
                      description: |-
                        ReplicasField is the dotted path of the replica count, such as spec.replicas: zero to
                        stop, the earlier count to start.
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: set a preset, or apiVersion, kind and replicasField
                    rule: has(self.preset) != (has(self.apiVersion) && has(self.kind)
                      && has(self.replicasField))
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              namespaceSelector:
                description: |-
                  NamespaceSelector adds every namespace whose labels match, such as the preview
                  environments of a pull request, so they join the group as they are created. A
                  namespace labelled costdeck.io/schedule=off is never selected, nor is the operator's
                  own. Where groups claim the same namespace, one that lists it by name wins over one
                  that selects it, and otherwise the older group. When a namespace stops matching, the
                  group brings back what it scaled down there. status.selectedNamespaces shows the
                  matches.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              namespaces:
                description: Namespaces is the list of namespaces managed by this
                  group
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              pauseGitOps:
                description: |-
                  PauseGitOps pauses the GitOps tools that would bring the workloads back while the
                  schedule keeps them down: Flux Kustomizations and HelmReleases are suspended and Argo CD
                  Applications lose self-heal, and they are resumed once everything is up again. Only
                  what CostDeck paused itself is resumed. Needs gitops.pause in the Helm chart.
                type: boolean
              schedules:
                description: Schedules define periodic scaling events for the group
                items:
                  description: |-
                    ScalingSchedule defines when a namespace should be active.

                    It supports two mutually exclusive forms:

                      - Daily window (legacy, default): "days" lists the weekdays the window applies to and
                        the window runs from StartTime to EndTime. If EndTime is earlier than StartTime the
                        window is treated as overnight and spills into the following day.
                      - Continuous weekly window: set StartDay and EndDay to define a single uninterrupted
                        window such as Monday 00:00 -> Friday 23:59. "days" is ignored in this form. The
                        window may wrap through Sunday midnight (e.g. Friday 20:00 -> Monday 08:00).
                  properties:
                    days:
                      description: |-
                        Days of week the daily window applies to (0-6, 0=Sunday).
                        Required unless StartDay/EndDay are used.
                      items:
                        type: integer
                      maxItems: 7
                      type: array
                      x-kubernetes-list-type: atomic
                    endDay:
                      description: |-
                        EndDay is the weekday a continuous weekly window closes on (0-6, 0=Sunday).
                        Must be set together with StartDay. When set, Days is ignored.
                      maximum: 6
                      minimum: 0
                      type: integer
                    endTime:
                      description: EndTime in HH:MM format
                      pattern: ^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$
                      type: string
                    startDay:
                      description: |-
                        StartDay is the weekday a continuous weekly window opens on (0-6, 0=Sunday).
                        Must be set together with EndDay. When set, Days is ignored.
                      maximum: 6
                      minimum: 0
                      type: integer
                    startTime:
                      description: StartTime in HH:MM format
                      pattern: ^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$
                      type: string
                    timezone:
                      description: |-
                        Timezone for the schedule (e.g. "UTC", "America/New_York").
                        If empty, local operator time is used.
                      type: string
                  required:
                  - endTime
                  - startTime
                  type: object
                  x-kubernetes-validations:
                  - message: startDay and endDay must be set together to define a
                      continuous weekly window
                    rule: has(self.startDay) == has(self.endDay)
                  - message: a schedule needs either days (daily window) or startDay
                      and endDay (continuous weekly window)
                    rule: has(self.startDay) || (has(self.days) && size(self.days)
                      > 0)
                type: array
                x-kubernetes-list-type: atomic
              sequence:
                description: |-
                  Sequence defines the order of scaling namespaces.
                  Each element can be a single namespace or multiple namespaces separated by spaces (a "stage").
                  Stages are executed sequentially, waiting for all namespaces in a stage to reach the target state.
                  Example: ["ns1", "ns2 ns3", "ns4"]
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
            required:
            - category
            type: object
            x-kubernetes-validations:
            - message: list namespaces or set a namespaceSelector
              rule: (has(self.namespaces) && size(self.namespaces) > 0) || has(self.namespaceSelector)
          status:
            description: status defines the observed state of ScalingGroup
            properties:
              conditions:
                description: Conditions represent the current state of the ScalingGroup
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              conflictingNamespaces:
                description: |-
                  ConflictingNamespaces lists namespaces this group skips because an older
                  ScalingGroup already manages them. A namespace is never scaled by two groups.
                items:
                  type: string
                type: array
              currency:
                description: Currency of EstimatedHourlySavings.
                type: string
              currentStage:
                description: |-
                  CurrentStage is the index, in execution order, of the stage the running transition
                  is on. Every earlier stage is at the target state or was given up on after the
                  stage timeout.
                type: integer
              desiredState:
                description: DesiredState is Up or Down.
                type: string
              estimatedHourlySavings:
                description: |-
                  EstimatedHourlySavings is what the workloads CostDeck keeps scaled down would cost
                  per hour at the current rates (requests x missing replicas), e.g. "1.2400".
                type: string
              exception:
                description: Exception names the exception or calendar day in force
                  while Mode is Exception.
                type: string
              exceptionEndsAt:
                description: ExceptionEndsAt is when the exception in force stops
                  applying.
                format: date-time
                type: string
              lastAction:
                description: LastAction is the timestamp of the last scaling event
                format: date-time
                type: string
              managedCount:
                description: ManagedCount is the current number of successfully managed
                  namespaces in the group
                type: integer
              mode:
                description: |-
                  Mode is what currently decides the desired state:
                  Schedule (spec.schedules), ManualUp / ManualDown (spec.active is set and the
                  schedule is ignored), Exception (a dated exception or calendar day), AlwaysOn (no
                  usable schedule, kept up as a fail-safe) or Dependency (a ScalingGroup kept up for a
                  group that depends on it).
                type: string
              namespacesReady:
                description: NamespacesReady is the number of namespaces that have
                  reached their target state
                type: integer
              namespacesTotal:
                description: NamespacesTotal is the total number of namespaces in
                  this group
                type: integer
              nextTransition:
                description: |-
                  NextTransition is when the desired state next changes on its own, either at a
                  schedule boundary or when the override expires. Unset when it never does.
                properties:
                  desiredState:
                    description: 'DesiredState after the change: Up or Down.'
                    type: string
                  time:
                    description: Time of the change.
                    format: date-time
                    type: string
                required:
                - desiredState
                - time
                type: object
              originalReplicas:
                additionalProperties:
                  format: int32
                  type: integer
                description: |-
                  OriginalReplicas stores the previous replica counts for restoration
                  Key format: "Namespace/Kind/Name"
                type: object
              overrideExpiresAt:
                description: |-
                  OverrideExpiresAt is when the manual override hands control back to the schedule.
                  Unset while an override without spec.activeUntil is in force.
                format: date-time
                type: string
              phase:
                description: Phase is the current state of the group (ScaledUp, ScalingDown,
                  ScaledDown)
                type: string
              readyNamespaces:
                description: ReadyNamespaces is the list of namespaces that are currently
                  at their target state
                items:
                  type: string
                type: array
              requiredBy:
                description: RequiredBy lists the dependent groups that currently
                  keep this group up.
                items:
                  type: string
                type: array
              scaleDownAt:
                description: ScaleDownAt is when that scale-down began.
                format: date-time
                type: string
              scaleDownNodes:
                description: |-
                  ScaleDownNodes are the nodes the scaled workloads ran on when the last scale-down
                  began, with what they cost then, so the realized-savings check can tell later whether
                  they went away. Cleared once the target is up again.
                items:
                  description: ScaleDownNode is a node a scale-down could free.
                  properties:
                    hourlyCost:
                      description: HourlyCost is what the node cost per hour when
                        the scale-down began, e.g. "0.1920".
                      type: string
                    name:
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 200
                type: array
                x-kubernetes-list-type: atomic
              selectedNamespaces:
                description: |-
                  SelectedNamespaces are the namespaces spec.namespaceSelector matched at the last
                  reconcile.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              skippedNamespaces:
                description: |-
                  SkippedNamespaces lists namespaces the running transition moved on without because
                  they did not reach the target state within the stage timeout. A namespace leaves the
                  list once it gets there.
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
