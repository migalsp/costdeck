---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: costdeckconfigs.finops.costdeck.io
spec:
  group: finops.costdeck.io
  names:
    kind: CostDeckConfig
    listKind: CostDeckConfigList
    plural: costdeckconfigs
    shortNames:
    - cdc
    singular: costdeckconfig
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: |-
          CostDeckConfig is the Schema for the costdeckconfigs API.
          It is a singleton resource (one per namespace, conventionally named "default")
          that holds all provider and integration settings.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired configuration
            properties:
              alerts:
                description: Alerts configures cost anomaly alerts.
                properties:
                  anomalies:
                    description: Anomalies alerts when a namespace's daily cost jumps
                      above its recent average.
                    properties:
                      enabled:
                        description: Enabled turns anomaly alerts on.
                        type: boolean
                      minimumDaily:
                        description: |-
                          MinimumDaily is the smallest daily increase worth an alert, in the cost currency,
                          so small namespaces do not page anyone. Defaults to "1".
                        pattern: ^[0-9]+(\.[0-9]+)?$
                        type: string
                      percent:
                        description: |-
                          Percent above the average of the seven days before that counts as an anomaly.
                          Defaults to 30.
                        maximum: 1000
                        minimum: 5
                        type: integer
                    type: object
                type: object
              allocation:
                description: |-
                  Allocation decides how cost that belongs to no team is charged in showback and
                  chargeback: capacity no pod requests, and namespaces everyone shares.
                properties:
                  idle:
                    description: |-
                      Idle is how capacity no pod requests is charged: separate (its own line, the
                      default) or proportional (spread over the namespaces by the compute they request).
                    enum:
                    - separate
                    - proportional
                    type: string
                  sharedNamespaces:
                    description: |-
                      SharedNamespaces are charged to the other namespaces instead of to themselves:
                      names or patterns such as kube-* or monitoring.
                    items:
                      type: string
                    maxItems: 100
                    type: array
                    x-kubernetes-list-type: set
                  sharedSplit:
                    description: |-
                      SharedSplit spreads the shared namespaces' cost by the compute the others request
                      (proportional, the default) or evenly.
                    enum:
                    - proportional
                    - even
                    type: string
                type: object
              auth:
                description: Auth configures single sign-on and local login.
                properties:
                  disableLocalLogin:
                    description: |-
                      DisableLocalLogin hides the username/password form once SSO works. The built-in
                      admin account (COSTDECK_AUTH_USER/PASSWORD) then only serves as break-glass access
                      through the API.
                    type: boolean
                  entra:
                    description: Entra configures Microsoft Entra ID single sign-on.
                    properties:
                      authorityHost:
                        default: https://login.microsoftonline.com
                        description: |-
                          AuthorityHost is the Entra login endpoint; override it for sovereign clouds
                          (https://login.microsoftonline.us, https://login.chinacloudapi.cn). It must be
                          HTTPS: the client secret is sent to it.
                        pattern: ^https://[^/\s]+/?$
                        type: string
                      autoProvision:
                        default: true
                        description: |-
                          AutoProvision lets any user of the tenant sign in with DefaultRole. When false, only
                          users matched by GroupRoleMapping or an app role may sign in.
                        type: boolean
                      clientId:
                        description: ClientID is the application (client) ID of the
                          app registration.
                        maxLength: 128
                        type: string
                      clientSecretRef:
                        description: ClientSecretRef names the Secret holding the
                          client secret under CLIENT_SECRET.
                        type: string
                      defaultRole:
                        default: viewer
                        description: |-
                          DefaultRole is granted to users who match no group or app role mapping:
                          viewer, operator or admin.
                        enum:
                        - viewer
                        - operator
                        - admin
                        type: string
                      enabled:
                        description: Enabled shows the "Sign in with Microsoft" button
                          and accepts Entra ID sign-ins.
                        type: boolean
                      groupRoleMapping:
                        additionalProperties:
                          type: string
                        description: |-
                          GroupRoleMapping maps Entra group object IDs (the "groups" claim) to a role. The most
                          privileged match wins. App roles named admin/operator/viewer are honoured as well.
                        type: object
                      redirectUrl:
                        description: |-
                          RedirectURL must match a redirect URI of the app registration exactly. Either
                          https://<host>/api/auth/entra/callback (server-side) or https://<host>/auth/callback
                          (single-page app). Derived from the request host when empty.
                        maxLength: 512
                        type: string
                      skipSslVerify:
                        description: |-
                          SkipSSLVerify disables TLS verification towards Entra. Only for SSL-inspecting
                          corporate proxies.
                        type: boolean
                      tenantId:
                        description: |-
                          TenantID is the directory (tenant) ID or a verified domain. "organizations" accepts
                          work accounts from any tenant (multi-tenant app registration); then only
                          GroupRoleMapping grants access, because app roles and auto-provisioning could be
                          abused from a foreign tenant.
                        maxLength: 128
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: tenantId and clientId are required when Entra SSO is
                        enabled
                      rule: '!self.enabled || (size(self.tenantId) > 0 && size(self.clientId)
                        > 0)'
                  oidc:
                    description: |-
                      OIDC configures single sign-on with any other OpenID Connect provider: Keycloak,
                      Okta, Auth0, Dex, Google and the like.
                    properties:
                      autoProvision:
                        default: true
                        description: |-
                          AutoProvision lets anyone the provider signs in use CostDeck with DefaultRole. When
                          false, only users matched by GroupRoleMapping or RolesClaim may sign in.
                        type: boolean
                      clientId:
                        description: ClientID of the client registered for CostDeck.
                        maxLength: 256
                        type: string
                      clientSecretRef:
                        description: |-
                          ClientSecretRef names the Secret holding the client secret under CLIENT_SECRET.
                          Without one the client is public and PKCE alone protects the code.
                        type: string
                      defaultRole:
                        default: viewer
                        description: 'DefaultRole is granted to users who match no
                          group or role: viewer, operator or admin.'
                        enum:
                        - viewer
                        - operator
                        - admin
                        type: string
                      displayName:
                        description: |-
                          DisplayName labels the button: "Sign in with <DisplayName>". Defaults to "single
                          sign-on".
                        maxLength: 64
                        type: string
                      enabled:
                        description: Enabled shows the sign-in button and accepts
                          sign-ins from the provider.
                        type: boolean
                      groupRoleMapping:
                        additionalProperties:
                          type: string
                        description: |-
                          GroupRoleMapping maps groups (as GroupsClaim lists them) to a role. The most
                          privileged match wins.
                        type: object
                      groupsClaim:
                        description: |-
                          GroupsClaim is the claim listing the user's groups; dotted paths reach nested claims.
                          Defaults to groups (Keycloak's group membership mapper; full paths such as /team-a
                          match a mapping with or without the leading slash).
                        maxLength: 128
                        type: string
                      issuerUrl:
                        description: |-
                          IssuerURL is the provider's issuer, whose /.well-known/openid-configuration is read,
                          e.g. https://keycloak.example.com/realms/costdeck. It must be HTTPS: the client
                          secret is sent to it.
                        maxLength: 512
                        pattern: ^https://[^\s]+$
                        type: string
                      redirectUrl:
                        description: |-
                          RedirectURL must match a redirect URI of the client exactly:
                          https://<host>/api/auth/oidc/callback. Derived from the request host when empty.
                        maxLength: 512
                        type: string
                      rolesClaim:
                        description: |-
                          RolesClaim is a claim listing roles named viewer, operator or admin, which are honoured
                          as they are, e.g. realm_access.roles (Keycloak realm roles) or
                          resource_access.costdeck.roles (client roles).
                        maxLength: 128
                        type: string
                      scopes:
                        description: |-
                          Scopes requested besides openid. Defaults to profile and email; add groups or roles
                          when the provider only sends those claims for a scope.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      skipSslVerify:
                        description: |-
                          SkipSSLVerify disables TLS verification towards the provider. Only for providers with
                          a certificate the operator cannot verify, and SSL-inspecting proxies.
                        type: boolean
                    type: object
                    x-kubernetes-validations:
                    - message: issuerUrl and clientId are required when OIDC sign-in
                        is enabled
                      rule: '!self.enabled || (size(self.issuerUrl) > 0 && size(self.clientId)
                        > 0)'
                type: object
              billing:
                description: Billing reconciles estimates with the cloud bill.
                properties:
                  aws:
                    description: |-
                      AWS reads the amortized EC2 cost from Cost Explorer (ce:GetCostAndUsage) for the
                      instances that carry the cluster's tag. The tag must be activated as a cost
                      allocation tag in the billing console.
                    properties:
                      tagKey:
                        description: |-
                          TagKey is the cost allocation tag on the cluster's instances. Defaults to
                          aws:eks:cluster-name.
                        type: string
                      tagValue:
                        description: TagValue is the tag's value, usually the cluster
                          name.
                        type: string
                    required:
                    - tagValue
                    type: object
                  azure:
                    description: |-
                      Azure reads the amortized virtual machine cost of the cluster's node resource group
                      from Cost Management (Cost Management Reader on that group).
                    properties:
                      resourceGroup:
                        description: ResourceGroup is the AKS node resource group,
                          e.g. MC_rg_cluster_westeurope.
                        pattern: ^[-\w._()]{1,90}$
                        type: string
                    required:
                    - resourceGroup
                    type: object
                  enabled:
                    description: Enabled turns reconciliation on.
                    type: boolean
                  gcp:
                    description: |-
                      GCP reads the Compute Engine cost of the cluster's nodes, credits included, from the
                      billing export in BigQuery (BigQuery Job User, and Data Viewer on the dataset).
                    properties:
                      clusterName:
                        description: ClusterName is the GKE cluster name, matched
                          against the goog-k8s-cluster-name label.
                        type: string
                      table:
                        description: Table is the billing export table, project.dataset.table.
                        pattern: ^[a-z][-a-z0-9]{4,28}[a-z0-9]\.[A-Za-z0-9_]+\.[A-Za-z0-9_]+$
                        type: string
                    required:
                    - clusterName
                    - table
                    type: object
                type: object
              budgets:
                description: |-
                  Budgets cap monthly spending of the cluster, namespaces, teams or environments and
                  alert when they are reached or forecast to be exceeded.
                items:
                  description: Budget caps what part of the cluster may cost in a
                    calendar month.
                  properties:
                    forecast:
                      description: Forecast also alerts, once a month, when spending
                        is forecast to exceed the limit.
                      type: boolean
                    monthlyLimit:
                      description: MonthlyLimit is the budget for a calendar month
                        in the cost currency, e.g. "1200".
                      pattern: ^[0-9]+(\.[0-9]+)?$
                      type: string
                    name:
                      description: Name identifies the budget in the dashboard and
                        in alerts.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    namespaces:
                      description: Namespaces are the namespaces a namespace budget
                        covers together, besides Value.
                      items:
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      maxItems: 500
                      type: array
                      x-kubernetes-list-type: set
                    scope:
                      description: |-
                        Scope is what the budget covers: the whole cluster, namespaces, a team (the
                        namespaces whose team label has Value) or an environment.
                      enum:
                      - cluster
                      - namespace
                      - team
                      - environment
                      type: string
                    thresholds:
                      description: |-
                        Thresholds are percentages of the limit that send an alert when spending reaches
                        them. Defaults to 80 and 100.
                      items:
                        type: integer
                      maxItems: 5
                      type: array
                      x-kubernetes-list-type: set
                    value:
                      description: |-
                        Value names the team or environment (production, non-production, system or
                        unclassified), or one namespace. Empty for the cluster.
                      type: string
                  required:
                  - monthlyLimit
                  - name
                  - scope
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              calendars:
                description: |-
                  Calendars are shared lists of days, such as public holidays, that schedules name in
                  spec.calendars to apply them as exceptions.
                items:
                  description: |-
                    HolidayCalendar is a named list of days on which the schedules that use it keep their
                    targets in State, typically down for public holidays.
                  properties:
                    days:
                      description: Days of the calendar.
                      items:
                        description: CalendarDay is one day of a HolidayCalendar.
                        properties:
                          date:
                            description: Date is the day, "2026-12-25".
                            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
                            type: string
                          name:
                            description: Name of the day, such as "Christmas Day".
                            maxLength: 100
                            type: string
                        required:
                        - date
                        type: object
                      maxItems: 400
                      type: array
                      x-kubernetes-list-type: atomic
                    name:
                      description: Name schedules use to refer to the calendar.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    state:
                      description: State targets are kept in on these days. Defaults
                        to Down.
                      enum:
                      - Up
                      - Down
                      type: string
                    timezone:
                      description: |-
                        Timezone the days are counted in. Defaults to the timezone of the schedule that
                        uses the calendar.
                      type: string
                  required:
                  - days
                  - name
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              clusterName:
                description: |-
                  ClusterName defines an optional identifier for this cluster.
                  Used in multi-cluster environments to distinguish bot commands.
                type: string
              clusters:
                description: |-
                  Clusters are other Cost Deck installations this one shows next to its own on the
                  Clusters page, read with a viewer API token of each.
                items:
                  description: RemoteCluster is another Cost Deck installation.
                  properties:
                    name:
                      description: Name is how the Clusters page calls it.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    secretRef:
                      description: |-
                        SecretRef names the Secret holding a viewer API token of that installation under
                        the cluster's name.
                      type: string
                    skipTlsVerify:
                      description: SkipTLSVerify accepts its certificate without checking
                        it.
                      type: boolean
                    url:
                      description: URL is where its dashboard answers, such as https://costdeck.eu.example.com.
                      pattern: ^https?://[^\s]+$
                      type: string
                  required:
                  - name
                  - url
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              dashboardUrl:
                description: |-
                  DashboardURL is the address people open Cost Deck at, e.g.
                  https://costdeck.example.com. The sleep page links to it to wake a namespace.
                maxLength: 512
                pattern: ^https?://[^\s]+$
                type: string
              features:
                description: Features holds core CostDeck feature toggles
                properties:
                  cloudPricingApi:
                    description: |-
                      CloudPricingAPI prices the cluster's nodes with the AWS Price List API (on-demand,
                      Linux) and derives the per-core and per-GiB rates from them. Needs the
                      pricing:GetProducts permission. Ignored when custom rates are set in spec.pricing.
                    type: boolean
                type: object
              integrations:
                description: Integrations holds AI and messenger configurations
                properties:
                  ai:
                    description: AI assistant and reports
                    properties:
                      baseUrl:
                        description: |-
                          BaseURL overrides the provider endpoint (gateways, proxies, self-hosted models).
                          Cloud providers may not point at loopback or link-local addresses.
                        type: string
                      enabled:
                        description: Enabled toggles the AI integration on/off
                        type: boolean
                      model:
                        description: |-
                          Model is the model ID, e.g. "claude-opus-5-5". Defaults per provider when empty;
                          the settings page lists the models the configured key can use.
                        type: string
                      monthlyTokenBudget:
                        description: |-
                          MonthlyTokenBudget caps the tokens (input and output) the assistant and AI reports
                          may use in a calendar month (UTC); once it is spent they refuse new requests until
                          the next month. 0 means no cap.
                        format: int64
                        minimum: 0
                        type: integer
                      provider:
                        description: |-
                          Provider is anthropic, openai, gemini, or local (any OpenAI-compatible endpoint such
                          as Ollama, vLLM or an internal gateway).
                        enum:
                        - anthropic
                        - openai
                        - gemini
                        - local
                        type: string
                      secretRef:
                        description: SecretRef is the name of the K8s Secret holding
                          the AI API key
                        type: string
                      skipSslVerify:
                        description: SkipSSLVerify allows skipping TLS certificate
                          verification for custom endpoints
                        type: boolean
                    type: object
                  mcp:
                    description: MCP Server configuration
                    properties:
                      enabled:
                        description: |-
                          Enabled serves MCP (Streamable HTTP) at /mcp on the dashboard's host and port,
                          behind the same authentication as the API: a session or an API token.
                        type: boolean
                      port:
                        description: 'Deprecated: MCP is served on the API port at
                          /mcp; this field is ignored.'
                        type: integer
                    type: object
                  messenger:
                    description: Messenger integrations
                    properties:
                      webex:
                        description: Webex bot
                        properties:
                          enabled:
                            description: Enabled toggles the Webex integration on/off
                            type: boolean
                          notifyTransitions:
                            description: |-
                              NotifyTransitions posts to RoomID whenever a ScalingGroup or ScalingConfig finishes
                              scaling up or down, with who triggered it and the estimated savings.
                            type: boolean
                          roomId:
                            description: |-
                              RoomID is the Webex space the bot answers in and posts notifications to. When empty
                              the bot answers in every space it is a member of.
                            type: string
                          secretRef:
                            description: |-
                              SecretRef is the name of the K8s Secret holding the Webex bot token (key BOT_TOKEN).
                              Adding a WEBHOOK_SECRET key switches delivery from polling to signed webhooks
                              (POST /api/webex/webhook).
                            type: string
                        type: object
                    type: object
                  notifications:
                    description: |-
                      Notifications sends alerts, digests and scaling changes to Slack, Microsoft Teams or
                      email, besides the Webex space.
                    properties:
                      email:
                        description: Email sends through an SMTP server.
                        properties:
                          enabled:
                            description: Enabled turns the channel on.
                            type: boolean
                          events:
                            description: Events limits what is sent; empty sends everything.
                            items:
                              description: |-
                                NotificationEvent is a kind of message Cost Deck sends: schedules (a schedule finished
                                scaling up or down), alerts (budgets, cost anomalies, namespaces about to be deleted) or
                                digests (the scheduled cost summary).
                              enum:
                              - schedules
                              - alerts
                              - digests
                              type: string
                            type: array
                            x-kubernetes-list-type: set
                          from:
                            description: From is the sender address.
                            type: string
                          host:
                            description: Host is the SMTP server, such as smtp.example.com.
                            maxLength: 253
                            type: string
                          port:
                            description: Port of the SMTP server. Defaults to 587,
                              or 465 with Security tls.
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                          secretRef:
                            description: SecretRef names the Secret holding the SMTP
                              password under PASSWORD.
                            type: string
                          security:
                            description: |-
                              Security is starttls (the default: upgrade the connection before signing in), tls
                              (TLS from the start, usually port 465) or none (a relay inside the cluster; no
                              password is sent without TLS).
                            enum:
                            - starttls
                            - tls
                            - none
                            type: string
                          to:
                            description: To lists the recipients.
                            items:
                              type: string
                            maxItems: 50
                            type: array
                            x-kubernetes-list-type: atomic
                          username:
                            description: Username signs in to the SMTP server; empty
                              sends without signing in.
                            type: string
                        type: object
                      slack:
                        description: Slack posts through an incoming webhook.
                        properties:
                          enabled:
                            description: Enabled turns the channel on.
                            type: boolean
                          events:
                            description: Events limits what the channel receives;
                              empty sends everything.
                            items:
                              description: |-
                                NotificationEvent is a kind of message Cost Deck sends: schedules (a schedule finished
                                scaling up or down), alerts (budgets, cost anomalies, namespaces about to be deleted) or
                                digests (the scheduled cost summary).
                              enum:
                              - schedules
                              - alerts
                              - digests
                              type: string
                            type: array
                            x-kubernetes-list-type: set
                          secretRef:
                            description: |-
                              SecretRef names the Secret holding the webhook URL under WEBHOOK_URL: whoever has
                              the URL can post to the channel, so it is kept out of the CR.
                            type: string
                        type: object
                      teams:
                        description: |-
                          Teams posts through a Microsoft Teams Workflows webhook ("Post to a channel when a
                          webhook request is received"), as an Adaptive Card.
                        properties:
                          enabled:
                            description: Enabled turns the channel on.
                            type: boolean
                          events:
                            description: Events limits what the channel receives;
                              empty sends everything.
                            items:
                              description: |-
                                NotificationEvent is a kind of message Cost Deck sends: schedules (a schedule finished
                                scaling up or down), alerts (budgets, cost anomalies, namespaces about to be deleted) or
                                digests (the scheduled cost summary).
                              enum:
                              - schedules
                              - alerts
                              - digests
                              type: string
                            type: array
                            x-kubernetes-list-type: set
                          secretRef:
                            description: |-
                              SecretRef names the Secret holding the webhook URL under WEBHOOK_URL: whoever has
                              the URL can post to the channel, so it is kept out of the CR.
                            type: string
                        type: object
                    type: object
                  victoriaMetrics:
                    description: VictoriaMetrics metrics integration
                    properties:
                      enabled:
                        description: Enabled toggles VictoriaMetrics as the metrics
                          source (instead of metrics-server)
                        type: boolean
                      endpoint:
                        description: |-
                          Endpoint is the PromQL-compatible query URL
                          e.g. "http://vmselect.monitoring.svc:8481/select/0/prometheus"
                        type: string
                      labelSelector:
                        description: |-
                          LabelSelector is added to every query as extra PromQL label matchers, e.g.
                          `cluster="prod-eu"`. Required when one VictoriaMetrics instance stores several
                          clusters: without it, namespaces with the same name are summed across clusters.
                        maxLength: 512
                        type: string
                      retentionDays:
                        default: 7
                        description: |-
                          RetentionDays is the lookback window for historical queries: how far back the
                          namespace usage charts can go, and the history behind right-sizing advice, which
                          is capped at 14 days.
                        minimum: 1
                        type: integer
                      secretRef:
                        description: |-
                          SecretRef is the name of the K8s Secret holding VictoriaMetrics credentials
                          (keys: BEARER_TOKEN or USERNAME/PASSWORD, and optionally CA_CERT with a PEM bundle)
                        type: string
                      skipSslVerify:
                        description: |-
                          SkipSSLVerify disables TLS certificate verification for the endpoint.
                          Prefer adding CA_CERT to the credentials Secret instead.
                        type: boolean
                    type: object
                type: object
              namespaceTTL:
                description: |-
                  NamespaceTTL deletes preview namespaces some time after they were created. Off by
                  default; it also needs namespaceTTL.enabled in the Helm chart.
                properties:
                  dryRun:
                    description: DryRun works out what would be deleted and when,
                      and deletes and sends nothing.
                    type: boolean
                  enabled:
                    description: Enabled turns deleting on.
                    type: boolean
                  selector:
                    description: |-
                      Selector picks the namespaces, such as env=preview. Required: an empty selector
                      would match every namespace.
                    maxLength: 1024
                    type: string
                  ttl:
                    description: TTL is how long after its creation a namespace is
                      deleted, such as 168h.
                    type: string
                  warnBefore:
                    description: |-
                      WarnBefore sends an alert to the notification channels this long before a
                      deletion. Defaults to 24h; 0s sends none.
                    type: string
                type: object
              pricing:
                description: Pricing sets custom cost rates.
                properties:
                  cpuCoreHour:
                    description: CPUCoreHour is the price of one CPU core for one
                      hour, e.g. "0.031".
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                  currency:
                    description: Currency is the ISO 4217 code shown next to costs.
                      Defaults to USD.
                    pattern: ^[A-Za-z]{3}$
                    type: string
                  gpuHour:
                    description: |-
                      GPUHour is the price of one GPU for one hour, e.g. "0.81", for every GPU model.
