replicaCount: 1

nameOverride: ""
fullnameOverride: "costdeck-operator"

image:
  repository: ghcr.io/migalsp/costdeck/costdeck-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.4.0" # x-release-please-version

imagePullSecrets: []

# The built-in admin account: break-glass access that always works, even when single
# sign-on is down. Its password is generated once into the <release>-admin-credentials
# Secret. Leave the username empty to keep the current one on upgrades ("costdeck" on a
# new install). Add accounts for people under Settings → Users in the dashboard.
adminUsername: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account (useful for AWS IRSA / Workload Identity)
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Only the elected leader reconciles and polls Webex; every replica serves the API and the
# dashboard. Keep this on whenever replicaCount can exceed 1, or two controllers will scale
# the same workloads and answer every chat message twice.
leaderElection:
  enabled: true

# Prometheus metrics: controller-runtime internals plus costdeck_* scaling state and
# estimated savings.
metrics:
  enabled: true
  port: 8080
  # Serve over HTTPS and require a bearer token authorised for GET /metrics (granted by the
  # <fullname>-metrics-reader ClusterRole). Plain HTTP is fine inside the cluster network.
  secure: false
  service:
    annotations: {}
  serviceMonitor:
    # Requires the Prometheus Operator CRDs.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels, for example the release label your Prometheus selects on.
    labels: {}

service:
  type: ClusterIP
  port: 8082
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: costdeck.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: costdeck-tls
  #    hosts:
  #      - costdeck.example.com

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Created automatically when replicaCount > 1 (a PDB on a single replica would block node
# drains); set enabled to force it.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

priorityClassName: ""

# Extra manager flags, for example --zap-log-level=debug.
extraArgs: []
extraEnv: []

nodeSelector: {}

tolerations: []

affinity: {}

# With replicaCount > 1 and nothing set here, replicas are spread over nodes
# (kubernetes.io/hostname, ScheduleAnyway).
topologySpreadConstraints: []
