replicaCount: 1

fullnameOverride: "costdeck-operator"

image:
  repository: 741448935696.dkr.ecr.us-east-1.amazonaws.com/migalsp/costdeck/costdeck-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.3.0" # x-release-please-version

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account (useful for AWS IRSA / Workload Identity)
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

service:
  type: ClusterIP
  port: 8082

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: costdeck.backup01.charter.aws.netcracker.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

nodeSelector: {}

tolerations: []

affinity: {}
