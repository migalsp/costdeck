{{- if .Values.namespaceTTL.enabled }}
# Lets preview cleanup (spec.namespaceTTL) delete the namespaces its selector picks once
# they are older than their time to live, and mark them when it warns or extends them
# (namespaceTTL.enabled). Off by default: deleting a namespace deletes everything in it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "costdeck-operator.fullname" . }}-namespace-ttl
  labels:
    {{- include "costdeck-operator.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "costdeck-operator.fullname" . }}-namespace-ttl
  labels:
    {{- include "costdeck-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "costdeck-operator.fullname" . }}-namespace-ttl
subjects:
- kind: ServiceAccount
  name: {{ include "costdeck-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
