{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "costdeck-operator.serviceAccountName" . }}
  labels:
    {{- include "costdeck-operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
# The ClusterRole and Role themselves are generated from the kubebuilder RBAC markers into
# rbac-roles.yaml by `make manifests`. Cluster-wide access is limited to reading
# namespaces/nodes/pods/metrics and scaling Deployments/StatefulSets; Secrets, Events and
# CostDeck's own resources are only granted inside the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "costdeck-operator.fullname" . }}-manager-rolebinding
  labels:
    {{- include "costdeck-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "costdeck-operator.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "costdeck-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "costdeck-operator.fullname" . }}-manager-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "costdeck-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "costdeck-operator.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "costdeck-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
