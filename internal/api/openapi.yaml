openapi: "3.0.3"
info:
  title: Cost Deck Operator API
  description: |
    REST API for the Cost Deck Kubernetes FinOps operator: namespace cost and usage,
    right-sizing advice, scaling schedules, settings and the AI assistant.

    **Authentication:** every endpoint except sign-in, the auth configuration and the Webex
    webhook needs either the `costdeck-session` cookie (from `POST /api/login` or Entra ID
    sign-in) or an API token sent as `Authorization: Bearer cdk_...`. Each endpoint requires
    at least the viewer, operator or admin role. MCP is served at `/mcp` with the same
    authentication.
  version: "1.3.0" # x-release-please-version
  contact:
    name: Cost Deck
    url: https://github.com/migalsp/costdeck
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /
    description: Current instance

tags:
  - name: Scaling
    description: Schedules (ScalingGroups), single-namespace configs and manual overrides
  - name: Namespaces
    description: Usage, pods and workloads per namespace
  - name: Right-sizing
    description: Advice on which requests can shrink
  - name: Costing
    description: Cost estimates and cloud resource discovery
  - name: System
    description: Operator version and cluster info
  - name: Health
    description: Operator self-monitoring and logs
  - name: AI
    description: Assistant chat and cost reports (Server-Sent Events)
  - name: Settings
    description: CostDeckConfig settings, connection tests and API tokens
  - name: Auth
    description: Sign-in, sign-out and single sign-on
  - name: Webex
    description: Inbound Webex webhook
  - name: Docs
    description: This specification and Swagger UI

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /api/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in
      description: Authenticate with username/password. Returns a session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: costdeck-admin
                password:
                  type: string
                  example: "<from-secret>"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: costdeck-session=eyJ...; Path=/; Max-Age=43200; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/logout:
    post:
      tags: [Auth]
      security: []
      summary: Sign out
      description: Clears the session cookie.
      responses:
        "200":
          description: Logout successful
        "429":
          description: Too many failed sign-in attempts from this address

  /api/auth/config:
    get:
      tags: [Auth]
      security: []
      summary: Available sign-in methods
      description: Public. Tells the login page whether to show the password form and the Microsoft button.
      responses:
        "200":
          description: Sign-in methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  disabled: { type: boolean, description: No sign-in method is configured (development mode) }
                  localLogin: { type: boolean }
                  entra:
                    type: object
                    properties:
                      enabled: { type: boolean }

  /api/auth/me:
    get:
      x-role: viewer
      tags: [Auth]
      summary: Current user
      description: Any signed-in user. The dashboard shows the sign-in page when this answers 401.
      responses:
        "200":
          description: The signed-in identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub: { type: string, example: "entra:7f3c..." }
                  name: { type: string }
                  email: { type: string }
                  role: { type: string, enum: [viewer, operator, admin] }
                  provider: { type: string, enum: [local, entra, anonymous] }
        "401":
          description: Not signed in

  /api/auth/entra/login:
    get:
      tags: [Auth]
      security: []
      summary: Start Microsoft Entra ID sign-in
      description: Redirects the browser to Entra ID (authorization code flow with PKCE).
      parameters:
        - name: return
          in: query
          description: Path to return to after signing in.
          schema: { type: string, example: /scaling }
      responses:
        "302":
          description: Redirect to login.microsoftonline.com

  /api/auth/entra/callback:
    get:
      tags: [Auth]
      security: []
      summary: Entra ID redirect URI (server-side mode)
      description: >
        Register https://<host>/api/auth/entra/callback as a Web redirect URI. Verifies state,
        PKCE, the ID token signature, audience, issuer and nonce, sets the session cookie and
        redirects back. Failures redirect with ?sso_error=<code>&sso_detail=<text>.
      responses:
        "302":
          description: Redirect back into the dashboard

  /api/auth/entra/callback-spa:
    post:
      tags: [Auth]
      security: []
      summary: Complete Entra ID sign-in (single-page-app mode)
      description: Used by the /auth/callback dashboard route when the app registration uses the SPA redirect URI.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        "200":
          description: Signed in; the session cookie is set
        "401":
          description: Sign-in rejected

  /api/version:
    get:
      x-role: viewer
      tags: [System]
      summary: Operator version
      responses:
        "200":
          description: Build version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: v1.0.0
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/cluster-info:
    get:
      x-role: viewer
      tags: [System]
      summary: Cluster summary
      description: Returns node count and total cluster resources.
      responses:
        "200":
          description: Cluster info
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: integer
                  totalCPU:
                    type: string
                  totalMemory:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/cluster/nodes:
    get:
      x-role: viewer
      tags: [System]
      summary: Node metrics
      description: Per-node resource metrics for the cluster heatmap.
      responses:
        "200":
          description: Node list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/operator/health:
    get:
      x-role: viewer
      tags: [Health]
      summary: Runtime health metrics
      description: Go runtime stats, CPU/memory usage, and historical data.
      responses:
        "200":
          description: Health data
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    $ref: "#/components/schemas/HealthCurrent"
                  history:
                    type: array
                    items:
                      type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/operator/logs:
    get:
      x-role: operator
      tags: [Health]
      summary: Operator logs
      description: Returns the trailing 100 lines of operator logs.
      responses:
        "200":
          description: Log text
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/operator/logs/download:
    get:
      x-role: admin
      tags: [Health]
      summary: Download full logs
      description: Downloads the complete operator log file.
      responses:
        "200":
          description: Log file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/namespaces:
    get:
      x-role: viewer
      tags: [Namespaces]
      summary: List namespaces
      description: Lists all monitored NamespaceFinOps CRDs.
      responses:
        "200":
          description: Namespace list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NamespaceFinOps"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/namespaces/{ns}/history:
    get:
      x-role: viewer
      tags: [Namespaces]
      summary: Usage history
      description: Resource usage history for the last 60 minutes.
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: History data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryPoint"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/namespaces/{ns}/pods:
    get:
      x-role: viewer
      tags: [Namespaces]
      summary: Pod metrics
      description: Pod-level resource metrics for the namespace.
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Pod list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PodDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/namespaces/{ns}/workloads:
    get:
      x-role: viewer
      tags: [Namespaces]
      summary: List workloads
      description: Lists Deployments and StatefulSets in the namespace.
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Workload list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkloadDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/namespaces/{ns}/workloads/{name}:
    put:
      x-role: operator
      tags: [Namespaces]
      summary: Scale workload
      description: Set replica count for a specific Deployment or StatefulSet.
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [Deployment, StatefulSet]
                replicas:
                  type: integer
      responses:
        "200":
          description: Scaled successfully
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/namespaces/{ns}/revert:
    post:
      x-role: operator
      tags: [Right-sizing]
      summary: Undo an earlier automatic right-sizing
      deprecated: true
      description: >-
        Versions up to 1.3 could rewrite requests and limits automatically. This restores the
        values from before that change. Cost Deck no longer changes requests itself, so this
        only matters for namespaces changed by an earlier version.
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Reverted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/namespaces/{ns}/recommendations:
    get:
      x-role: viewer
      tags: [Right-sizing]
      summary: Right-sizing recommendations
      description: >-
        Compares each container's requests with observed demand: p95 CPU and peak memory over
        up to 14 days when VictoriaMetrics is connected, otherwise a single metrics-server
        reading with a larger margin. Read-only; results are cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendations"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: No usage data is available for the namespace.

  /api/namespaces/{ns}/optimization:
    get:
      x-role: viewer
      tags: [Right-sizing]
      summary: Earlier automatic right-sizing
      deprecated: true
      description: >-
        Whether an automatic right-sizing made by version 1.3 or earlier is still in effect,
        with the values before and after. Undo it with POST /api/namespaces/{ns}/revert.
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Optimization info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizationStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/scaling/groups:
    get:
      x-role: viewer
      tags: [Scaling]
      summary: List scaling groups
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScalingGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      x-role: admin
      tags: [Scaling]
      summary: Create scaling group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScalingGroup"
      responses:
        "201":
          description: Group created
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/scaling/groups/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      x-role: viewer
      tags: [Scaling]
      summary: Get scaling group
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScalingGroup"
    put:
      x-role: admin
      tags: [Scaling]
      summary: Update scaling group
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScalingGroup"
      responses:
        "200":
          description: Group updated
    delete:
      x-role: admin
      tags: [Scaling]
      summary: Delete scaling group
      responses:
        "204":
          description: Group deleted

  /api/scaling/groups/{name}/manual:
    post:
      x-role: operator
      tags: [Scaling]
      summary: Start now, scale down now, or follow the schedule
      description: >-
        The "Start now", "Scale down now" and "Follow schedule" buttons. An override without
        activeUntil or until holds until it is cleared with {"active": null}.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                  nullable: true
                  description: >
                    true forces scale up, false forces scale down, null clears the override
                    and hands control back to the schedule.
                activeUntil:
                  type: string
                  format: date-time
                  description: >
                    Optional deadline. The override is honoured until this timestamp, after
                    which the schedule takes over again. Must be in the future.
                until:
                  type: string
                  example: nextTransition
                  description: >
                    Relative alternative to activeUntil: "nextTransition" holds the override
                    until the schedule would change state on its own, or a Go duration such
                    as "4h". Clearing the override (active null) also removes the legacy
                    costdeck.io/manual-override annotation.
            examples:
              startUntilNextChange:
                summary: Start now, until the next scheduled change
                value: { active: true, until: nextTransition }
              downForFourHours:
                summary: Scale down for four hours
                value: { active: false, until: 4h }
              followSchedule:
                summary: Follow the schedule again
                value: { active: null }
      responses:
        "200":
          description: Override applied
        "400":
          description: Invalid deadline or duration

  /api/scaling/configs:
    get:
      x-role: viewer
      tags: [Scaling]
      summary: List scaling configs
      responses:
        "200":
          description: Config list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScalingConfig"
    post:
      x-role: admin
      tags: [Scaling]
      summary: Create scaling config
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScalingConfig"
      responses:
        "201":
          description: Config created

  /api/scaling/configs/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      x-role: viewer
      tags: [Scaling]
      summary: Get scaling config
      responses:
        "200":
          description: Config details
    put:
      x-role: admin
      tags: [Scaling]
      summary: Update scaling config
      description: Replaces the whole spec. Fields left out are removed, so send the complete object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScalingConfig"
      responses:
        "200":
          description: Config updated
    delete:
      x-role: admin
      tags: [Scaling]
      summary: Delete scaling config
      responses:
        "204":
          description: Config deleted

  /api/scaling/configs/{name}/manual:
    post:
      x-role: operator
      tags: [Scaling]
      summary: Start now, scale down now, or follow the schedule
      description: Same as the group endpoint, for a single-namespace config.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                  nullable: true
                  description: >
                    true forces scale up, false forces scale down, null clears the override
                    and hands control back to the schedule.
                activeUntil:
                  type: string
                  format: date-time
                  description: >
                    Optional deadline. The override is honoured until this timestamp, after
                    which the schedule takes over again. Must be in the future.
                until:
                  type: string
                  example: nextTransition
                  description: >
                    Relative alternative to activeUntil: "nextTransition" holds the override
                    until the schedule would change state on its own, or a Go duration such
                    as "4h". Clearing the override (active null) also removes the legacy
                    costdeck.io/manual-override annotation.
      responses:
        "200":
          description: Override applied
        "400":
          description: Invalid deadline or duration

  /api/scaling/groups/{name}/events:
    get:
      x-role: viewer
      tags: [Scaling]
      summary: Kubernetes events of a group
      description: Events recorded for the ScalingGroup, oldest first; the activity view uses them.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/costing:
    post:
      x-role: viewer
      tags: [Costing]
      summary: Estimate cost
      description: Prices a namespace, node or the whole cluster at the rates in effect (custom rates, cloud list prices or the estimate).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType]
              properties:
                targetType: { type: string, enum: [namespace, node, cluster] }
                targetName: { type: string }
                totalCpu: { type: number, description: "cores, for node and cluster targets" }
                totalMemoryGb: { type: number, description: "GiB, for node and cluster targets" }
      responses:
        "200":
          description: Estimate
          content:
            application/json:
              schema:
                type: object
                properties:
                  hourlyCost: { type: number }
                  monthlyCost: { type: number }
                  currency: { type: string }
                  determinedBy: { type: string, description: "where the rates came from" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/discovery:
    get:
      x-role: viewer
      tags: [Costing]
      summary: Discover every cloud resource
      description: Lists the configured resource types of every enabled cloud provider. A provider that fails is reported under errors without hiding the others.
      responses:
        "200":
          description: Resources and per-provider errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources: { type: array, items: { type: object } }
                  errors: { type: object, additionalProperties: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/discovery/{provider}/{type}:
    get:
      x-role: viewer
      tags: [Costing]
      summary: Discover cloud resources of one type
      description: Lists resources that can join a schedule's start order. Types are aurora and ec2 (aws), vm, postgres and mysql (azure), gce and cloudsql (gcp).
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [aws, azure, gcp] } }
        - { name: type, in: path, required: true, schema: { type: string, enum: [aurora, ec2, vm, postgres, mysql, gce, cloudsql] } }
      responses:
        "200":
          description: Discovered resources
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    provider: { type: string }
                    type: { type: string }
                    identifier: { type: string }
                    name: { type: string }
                    region: { type: string }
                    status: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { description: Provider not supported }

  /api/ai/chat:
    post:
      x-role: viewer
      tags: [AI]
      summary: Chat with the assistant
      description: >-
        Streams the answer as Server-Sent Events. Each `data:` line is a JSON event of type
        text, reset, tool_call, tool_result, confirm, error or done. A `confirm` event names a
        mutating tool the model wants to run; nothing happens until the client calls
        POST /api/ai/tools/{name}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  type: { type: string }
                  text: { type: string }
                  tool: { type: string }
                  args: { type: object }
                  isError: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/ai/tools/{name}:
    post:
      x-role: operator
      tags: [AI]
      summary: Run a confirmed assistant action
      description: Runs a mutating tool (scale_group, scale_namespace, revert_optimization) the user confirmed. Requires the operator role.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                args: { type: object }
      responses:
        "200":
          description: Result text
          content:
            application/json:
              schema: { type: object, properties: { result: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Requires the operator role }

  /api/ai/report:
    get:
      x-role: viewer
      tags: [AI]
      summary: Saved cost report
      responses:
        "200":
          description: The last saved report (empty when none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  report: { type: string, description: Markdown }
                  generatedAt: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/ai/report/generate:
    post:
      x-role: operator
      tags: [AI]
      summary: Generate a cost report
      description: Streams a new Markdown report as Server-Sent Events (same event format as chat) and saves it when done.
      responses:
        "200": { description: Event stream, content: { text/event-stream: {} } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/ai/report/save:
    post:
      x-role: operator
      tags: [AI]
      summary: Save an edited report
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { report: { type: string } } }
      responses:
        "200": { description: Saved }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/settings:
    get:
      x-role: viewer
      tags: [Settings]
      summary: Read settings
      description: The CostDeckConfig settings with connection status. Credentials are never returned, only whether they are set.
      responses:
        "200": { description: Settings, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      x-role: admin
      tags: [Settings]
      summary: Update settings
      description: >-
        Updates the sections present in the body (providers, integrations, features, pricing,
        auth). Omitted credential fields keep the stored Secret. Requires the admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            examples:
              victoriaMetrics:
                summary: Connect VictoriaMetrics
                value:
                  integrations:
                    victoriaMetrics: { enabled: true, endpoint: "http://vmselect.monitoring:8481/select/0/prometheus", retentionDays: 14 }
              customRates:
                summary: Use your own prices
                value:
                  pricing: { cpuCoreHour: "0.031", memoryGiBHour: "0.0042", currency: EUR }
              azure:
                summary: Enable Azure with workload identity
                value:
                  providers:
                    azure: { enabled: true, subscriptionId: "00000000-0000-0000-0000-000000000000", resourceTypes: [vm, postgres] }
      responses:
        "200": { description: Updated settings, content: { application/json: { schema: { type: object } } } }
        "400": { description: Invalid settings }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/settings/providers/{provider}/test:
    post:
      x-role: admin
      tags: [Settings]
      summary: Test a connection
      description: Tests unsaved credentials or settings. For cloud providers it also reports how many resources discovery finds.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [aws, azure, gcp, ai, entra, webex, victoriametrics] } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: { type: boolean }
                  message: { type: string }
                  error: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/settings/providers/{provider}/status:
    get:
      x-role: viewer
      tags: [Settings]
      summary: Connection status of a configured provider
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Status, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/settings/ai/models:
    post:
      x-role: admin
      tags: [Settings]
      summary: List AI models
      description: Asks the AI provider (with the given or stored credentials) which models it offers.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [anthropic, openai, gemini, local] }
                baseUrl: { type: string }
                apiKey: { type: string }
      responses:
        "200":
          description: Models
          content:
            application/json:
              schema:
                type: object
                properties:
                  models: { type: array, items: { type: string } }
                  default: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/tokens:
    get:
      x-role: admin
      tags: [Settings]
      summary: List API tokens
      responses:
        "200":
          description: Tokens (never the token values)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TokenInfo" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      x-role: admin
      tags: [Settings]
      summary: Create an API token
      description: The token value is returned once and only its hash is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: { type: string }
                role: { type: string, enum: [viewer, operator, admin] }
                expiresInDays: { type: integer, minimum: 0, maximum: 3650, description: "0 = never" }
            example: { name: ci-pipeline, role: operator, expiresInDays: 90 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: cdk_... }
                  info: { $ref: "#/components/schemas/TokenInfo" }
        "400": { description: Invalid request }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/tokens/{name}:
    delete:
      x-role: admin
      tags: [Settings]
      summary: Revoke an API token
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/webex/webhook:
    post:
      tags: [Webex]
      summary: Webex webhook
      description: Receives Webex message events when a webhook secret is configured. The body must carry a valid HMAC-SHA1 X-Spark-Signature; no session or token is needed.
      security: []
      parameters:
        - { name: X-Spark-Signature, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: Accepted }
        "401": { description: Missing or invalid signature }

  /api/openapi.yaml:
    get:
      tags: [Docs]
      security: []
      summary: OpenAPI specification (YAML)
      responses:
        "200":
          description: This document
          content:
            application/x-yaml: {}

  /api/openapi.json:
    get:
      tags: [Docs]
      security: []
      summary: OpenAPI specification (JSON)
      responses:
        "200":
          description: This document as JSON
          content:
            application/json: {}

  /api/docs:
    get:
      tags: [Docs]
      security: []
      summary: Swagger UI
      description: Interactive documentation where requests can be tried out.
      responses:
        "200":
          description: HTML page
          content:
            text/html: {}

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: costdeck-session
    bearerAuth:
      type: http
      scheme: bearer
      description: API token (cdk_...) from Settings → Access & SSO.
  parameters:
    Namespace:
      name: ns
      in: path
      required: true
      description: Target namespace name
      schema:
        type: string

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Authentication required

    NodeMetrics:
      type: object
      properties:
        name:
          type: string
        cpuCapacity:
          type: string
        cpuUsage:
          type: string
        memoryCapacity:
          type: string
        memoryUsage:
          type: string
        pods:
          type: integer

    HealthCurrent:
      type: object
      properties:
        status:
          type: string
          example: healthy
        goroutines:
          type: integer
        cpuUsage:
          type: number
        memoryUsage:
          type: number
        gcCycles:
          type: integer
        managedNamespaces:
          type: integer
        cpuRequests:
          type: number
        cpuLimits:
          type: number
        memoryRequests:
          type: number
        memoryLimits:
          type: number

    ResourceMetrics:
      type: object
      properties:
        usage:
          type: string
        requests:
          type: string
        limits:
          type: string

    HistoryPoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        cpu:
          $ref: "#/components/schemas/ResourceMetrics"
        memory:
          $ref: "#/components/schemas/ResourceMetrics"

    PodDetail:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        cpu:
          $ref: "#/components/schemas/ResourceMetrics"
        memory:
          $ref: "#/components/schemas/ResourceMetrics"

    WorkloadDetail:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [Deployment, StatefulSet]
        replicas:
          type: integer
        readyReplicas:
          type: integer
        status:
          type: string

    NamespaceFinOps:
      type: object
      properties:
        metadata:
          type: object
          properties:
            name:
              type: string
            namespace:
              type: string
        spec:
          type: object
          properties:
            targetNamespace:
              type: string
        status:
          type: object
          properties:
            insights:
              type: array
              items:
                type: string

    Recommendations:
      type: object
      properties:
        namespace: { type: string }
        source: { type: string, enum: [victoriametrics, metrics-server] }
        historical: { type: boolean, description: "true for p95/peak over a window, false for a single reading" }
        window: { type: string, example: 14d }
        basis: { type: string }
        warning: { type: string }
        currency: { type: string, example: USD }
        monthlySavings: { type: number }
        workloads:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [Deployment, StatefulSet] }
              name: { type: string }
              replicas: { type: integer }
              monthlySavings: { type: number }
              containers:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    cpu: { $ref: "#/components/schemas/ResourceAdvice" }
                    memory: { $ref: "#/components/schemas/ResourceAdvice" }
    TokenInfo:
      type: object
      properties:
        name: { type: string }
        role: { type: string, enum: [viewer, operator, admin] }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        expiresAt: { type: string, format: date-time }
    ResourceAdvice:
      type: object
      properties:
        request: { type: string, example: "1" }
        observed: { type: string, example: 100m }
        recommended: { type: string, example: 120m }
        action: { type: string, enum: [reduce, increase, keep, set, unknown] }
    OptimizationStatus:
      type: object
      properties:
        active:
          type: boolean
        optimizedAt:
          type: string
          format: date-time
        workloads:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              kind:
                type: string
              original:
                $ref: "#/components/schemas/ResourceValues"
              optimized:
                $ref: "#/components/schemas/ResourceValues"

    ResourceValues:
      type: object
      properties:
        cpuRequest:
          type: string
        cpuLimit:
          type: string
        memoryRequest:
          type: string
        memoryLimit:
          type: string

    ScalingGroup:
      type: object
      description: A schedule for a set of namespaces and cloud resources (kind ScalingGroup).
      example:
        metadata: { name: dev }
        spec:
          category: Environments
          namespaces: [dev-frontend, dev-backend]
          schedules:
            - { days: [1, 2, 3, 4, 5], startTime: "08:00", endTime: "19:00", timezone: Europe/Berlin }
          dependsOn: [platform]
          sequence: [dev-backend, dev-frontend]
      properties:
        metadata:
          type: object
          properties:
            name: { type: string, description: "Lowercase letters, digits and dashes." }
        spec:
          type: object
          required: [category, namespaces]
          properties:
            category:
              type: string
              description: Section the schedule is listed under, for example Platform or Environments.
            namespaces:
              type: array
              items: { type: string }
            schedules:
              type: array
              description: When the namespaces run. Windows are OR-ed; outside all of them everything is scaled down.
              items: { $ref: "#/components/schemas/ScalingSchedule" }
            activation:
              type: string
              enum: [Schedule, OnDemand]
              description: OnDemand has no hours of its own and runs only while a schedule that depends on it needs it.
            dependsOn:
              type: array
              items: { type: string }
              description: Schedules this one starts after. They are kept up while this one runs.
            sequence:
              type: array
              items: { type: string }
              description: >-
                Start order. Each entry is a stage of space-separated namespaces or ext:<identifier>
                cloud resources. Stages start top to bottom and stop bottom to top; namespaces in no
                stage start last.
            externalTargets:
              type: array
              items: { $ref: "#/components/schemas/ExternalTarget" }
            featureFlags:
              type: object
              properties:
                skipOnTimeout: { type: boolean, description: "Move on when a namespace is not ready in time." }
                timeoutMinutes: { type: integer, minimum: 1, maximum: 30, default: 5 }
            active:
              type: boolean
              nullable: true
              description: >-
                Manual override, normally set through the /manual endpoint. Absent (null) means
                the schedule is followed; false does not mean "follow the schedule", it keeps the
                namespaces down.
            activeUntil:
              type: string
              format: date-time
              description: When the manual override ends by itself.
        status:
          type: object
          description: Written by the operator. phase is ScaledUp, ScalingUp, ScalingDown, ScaledDown or WaitingForDependencies; mode says what decides the state (Schedule, ManualUp, ManualDown, AlwaysOn, Dependency, OnDemand).

    ScalingConfig:
      type: object
      description: >-
        A schedule for a single namespace (kind ScalingConfig). The dashboard uses it for
        workload rules on a namespace. A namespace that belongs to a ScalingGroup follows the
        group; its config then only contributes exclusions and workload order.
      example:
        metadata: { name: dev-backend }
        spec:
          targetNamespace: dev-backend
          exclusions: [redis-*]
          sequence: [postgres, "api-* worker"]
      properties:
        metadata:
          type: object
          properties:
            name: { type: string }
        spec:
          type: object
          required: [targetNamespace]
          properties:
            targetNamespace: { type: string }
            schedules:
              type: array
              items: { $ref: "#/components/schemas/ScalingSchedule" }
            exclusions:
              type: array
              items: { type: string }
              description: Workloads that never scale down, by name or prefix glob ("redis-*").
            sequence:
              type: array
              items: { type: string }
              description: Workload start order. Each entry is a stage of space-separated name globs.
            active:
              type: boolean
              nullable: true
              description: Manual override; absent (null) means the schedule is followed.
            activeUntil:
              type: string
              format: date-time

    ExternalTarget:
      type: object
      description: A cloud resource started and stopped with the schedule.
      required: [provider, type, identifier]
      properties:
        provider: { type: string, enum: [aws, azure, gcp] }
        type: { type: string, enum: [aurora, ec2, vm, postgres, mysql, gce, cloudsql] }
        identifier:
          type: string
          description: "AWS: cluster identifier or instance ID. Azure: full resource ID. Google Cloud: <zone>/<name> for Compute Engine, the instance name for Cloud SQL."
        region: { type: string }
        name: { type: string, description: Display name. }

    ScalingSchedule:
      type: object
      description: >
        One availability window. Either a daily window (days + startTime/endTime, where an
        endTime earlier than startTime runs overnight into the next day) or a continuous
        multi-day window (startDay/endDay), which may wrap through Sunday.
      properties:
        days:
          type: array
          description: Weekdays the daily window applies to (0 = Sunday). Ignored when startDay/endDay are set.
          items:
            type: integer
            minimum: 0
            maximum: 6
        startDay:
          type: integer
          minimum: 0
          maximum: 6
          description: Weekday a continuous window opens on. Must be set together with endDay.
          example: 1
        endDay:
          type: integer
          minimum: 0
          maximum: 6
          description: Weekday a continuous window closes on. Must be set together with startDay.
          example: 5
        startTime:
          type: string
          example: "08:00"
        endTime:
          type: string
          example: "20:00"
        timezone:
          type: string
          example: Europe/Bratislava
