  /api/namespace-ttl:
    get:
      x-role: viewer
      tags: [Scaling]
      summary: Preview cleanup
      description: >-
        The preview cleanup setting (spec.namespaceTTL), every namespace its selector picks with
        when it is deleted (soonest first; protected ones say why they never are), the namespaces it
        deleted, and whether the operator may delete namespaces at all (namespaceTTL.enabled in the
        Helm chart). selector and ttl work the plan out for unsaved values.
      parameters:
        - { name: selector, in: query, schema: { type: string }, example: env=preview }
