  /api/scaling/groups/{name}/realized:
    get:
      x-role: viewer
      tags: [Scaling]
      summary: Realized savings of a group's scale-down
      description: >-
        Whether the last scale-down lowered the bill: the nodes the scaled workloads ran on when
        it began (with what they cost then), which of them autoscalers have removed, and for
        each node still there what keeps it (PodDisruptionBudgets that allow no disruption,
        karpenter.sh/do-not-disrupt, cluster-autoscaler.kubernetes.io/safe-to-evict "false",
        local storage, pods no controller would recreate, kube-system pods without a budget,
        node annotations) and what other namespaces still request on it. state is none while
        nothing is recorded (the target is up, or was already down), settling during the first
        settleMinutes after the scale-down began, and checked afterwards.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealizedSavings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No such schedule }

  /api/scaling/configs/{name}/realized:
