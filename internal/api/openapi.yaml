            schema:
              type: object
              properties:
                active:
                  type: boolean
                  nullable: true
                  description: >
                    true forces scale up, false forces scale down, null clears the override
                    and hands control back to the schedule.
                activeUntil:
                  type: string
                  format: date-time
                  description: >
                    Optional deadline. The override is honoured until this timestamp, after
