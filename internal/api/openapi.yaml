openapi: "3.0.3"
info:
  title: Cost Deck Operator API
  description: |
    REST API for the Cost Deck Kubernetes FinOps operator: namespace cost and usage,
    right-sizing advice, scaling schedules, settings and the AI assistant.

    **Authentication:** every endpoint except sign-in, the auth configuration and the Webex
    webhook needs either the `costdeck-session` cookie (from `POST /api/login` or Entra ID
    sign-in) or an API token sent as `Authorization: Bearer cdk_...`. Each endpoint requires
    at least the viewer, operator or admin role. MCP is served at `/mcp` with the same
    authentication.
  version: "1.6.2" # x-release-please-version
  contact:
    name: Cost Deck
    url: https://github.com/migalsp/costdeck
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /
    description: Current instance

tags:
  - name: Scaling
    description: Schedules (ScalingGroups), single-namespace configs and manual overrides
  - name: Namespaces
    description: Usage, pods and workloads per namespace
  - name: Right-sizing
    description: Advice on which requests can shrink
  - name: Costing
    description: Cost estimates and cloud resource discovery
  - name: System
    description: Operator version and cluster info
  - name: Health
    description: Operator self-monitoring and logs
  - name: Reports
    description: The cost digest, its schedule and the report history
  - name: AI
    description: Assistant chat and cost reports (Server-Sent Events)
  - name: Settings
    description: CostDeckConfig settings, connection tests and API tokens
  - name: Auth
    description: Sign-in, sign-out and single sign-on
  - name: Users
    description: Local accounts, their roles and who signed in
  - name: Webex
    description: Inbound Webex webhook
  - name: Docs
    description: This specification and Swagger UI

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /api/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in
      description: Authenticate with username/password. Returns a session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: costdeck
                password:
                  type: string
                  example: "<from-secret>"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: costdeck-session=eyJ...; Path=/; Max-Age=43200; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/logout:
    post:
      tags: [Auth]
      security: []
      summary: Sign out
      description: Clears the session cookie.
      responses:
        "200":
          description: Logout successful
        "429":
          description: Too many failed sign-in attempts from this address

  /api/auth/config:
    get:
      tags: [Auth]
      security: []
      summary: Available sign-in methods
      description: Public. Tells the login page whether to show the password form and the Microsoft button.
      responses:
        "200":
          description: Sign-in methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  disabled: { type: boolean, description: No sign-in method is configured (development mode) }
                  localLogin: { type: boolean }
                  entra:
                    type: object
                    properties:
                      enabled: { type: boolean }

  /api/auth/password:
    post:
      x-role: viewer
      tags: [Auth]
      summary: Change my password
      description: For local users. Ends the user's other sessions and re-issues this one. The built-in admin's password lives in the Helm release's admin-credentials Secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12 }
      responses:
        "200": { description: Changed; a new session cookie is set }
        "400": { description: Not a local user, or the new password is too short }
        "403": { description: The current password is wrong }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/me:
    get:
      x-role: viewer
      tags: [Auth]
      summary: Current user
      description: Any signed-in user. The dashboard shows the sign-in page when this answers 401.
      responses:
        "200":
          description: The signed-in identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub: { type: string, example: "entra:7f3c..." }
                  name: { type: string }
                  email: { type: string }
                  role: { type: string, enum: [viewer, operator, admin] }
                  provider: { type: string, enum: [local, entra, token, anonymous] }
                  mustChangePassword: { type: boolean, description: "A local user whose password an administrator chose; every other call answers 403 until they change it." }
        "401":
          description: Not signed in

  /api/auth/entra/login:
    get:
      tags: [Auth]
      security: []
      summary: Start Microsoft Entra ID sign-in
      description: Redirects the browser to Entra ID (authorization code flow with PKCE).
      parameters:
        - name: return
          in: query
          description: Path to return to after signing in.
          schema: { type: string, example: /scaling }
      responses:
        "302":
          description: Redirect to login.microsoftonline.com

  /api/auth/entra/callback:
    get:
      tags: [Auth]
      security: []
      summary: Entra ID redirect URI (server-side mode)
      description: >
        Register https://<host>/api/auth/entra/callback as a Web redirect URI. Verifies state,
        PKCE, the ID token signature, audience, issuer and nonce, sets the session cookie and
        redirects back. Failures redirect with ?sso_error=<code>&sso_detail=<text>.
      responses:
        "302":
          description: Redirect back into the dashboard

  /api/auth/oidc/login:
    get:
      tags: [Auth]
      security: []
      summary: Start OpenID Connect sign-in (Keycloak, Okta, …)
      description: >-
        Redirects the browser to the issuer in spec.auth.oidc (authorization code flow with
        PKCE and a nonce).
      parameters:
        - name: return
          in: query
          description: Path to return to after signing in.
          schema: { type: string, example: /scaling }
      responses:
        "302":
          description: Redirect to the provider's sign-in page

  /api/auth/oidc/callback:
    get:
      tags: [Auth]
      security: []
      summary: OpenID Connect redirect URI
      description: >
        Register https://<host>/api/auth/oidc/callback as the client's redirect URI. Verifies
        state, PKCE, the ID token signature, audience, issuer and nonce, maps the groups claim
        (spec.auth.oidc.groupsClaim, default groups) through groupRoleMapping and honours
        roles named viewer, operator or admin in rolesClaim, sets the session cookie and
        redirects back. Failures redirect with ?sso_error=<code>&sso_detail=<text>.
      responses:
        "302":
          description: Redirect back into the dashboard

  /api/auth/entra/callback-spa:
    post:
      tags: [Auth]
      security: []
      summary: Complete Entra ID sign-in (single-page-app mode)
      description: Used by the /auth/callback dashboard route when the app registration uses the SPA redirect URI.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        "200":
          description: Signed in; the session cookie is set
        "401":
          description: Sign-in rejected

  /api/version:
    get:
      x-role: viewer
      tags: [System]
      summary: Operator version
      responses:
        "200":
          description: Build version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: v1.0.0
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/cluster-info:
    get:
      x-role: viewer
      tags: [System]
      summary: Cluster summary
      description: Returns node count and total cluster resources.
      responses:
        "200":
          description: Cluster info
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: integer
                  totalCPU:
                    type: string
                  totalMemory:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/cluster/nodes:
    get:
      x-role: viewer
      tags: [System]
      summary: Node metrics
      description: Per-node resource metrics for the cluster heatmap.
      responses:
        "200":
          description: Node list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/operator/health:
    get:
      x-role: viewer
      tags: [Health]
      summary: Runtime health metrics
      description: Go runtime stats, CPU/memory usage, and historical data.
      responses:
        "200":
          description: Health data
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    $ref: "#/components/schemas/HealthCurrent"
                  history:
                    type: array
                    items:
                      type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/operator/logs:
    get:
      x-role: operator
      tags: [Health]
      summary: Operator logs
      description: Returns the trailing 100 lines of operator logs.
      responses:
        "200":
          description: Log text
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/operator/logs/download:
    get:
      x-role: admin
      tags: [Health]
      summary: Download full logs
      description: Downloads the complete operator log file.
      responses:
        "200":
          description: Log file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/namespaces:
    get:
      x-role: viewer
      tags: [Namespaces]
      summary: List namespaces
      description: Lists all monitored NamespaceFinOps CRDs.
      responses:
        "200":
          description: Namespace list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NamespaceFinOps"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/namespaces/{ns}/schedule-suggestion:
    get:
      x-role: viewer
      tags: [Namespaces]
      summary: Suggest a schedule from usage
      description: >-
        Working hours read from the namespace's CPU usage over the last week (VictoriaMetrics):
        the hours it was busy, relative to its own idle level, plus an hour on either side,
        merged into weekly windows in the given time zone. reason is pattern (schedules
        suggested), steady (busy at almost every hour), idle (no activity) or insufficient
        (less than a day of history). monthlySaving is what the schedule would keep down at
        the namespace's current cost.
      parameters:
        - { name: ns, in: path, required: true, schema: { type: string } }
        - { name: timezone, in: query, schema: { type: string, default: UTC }, example: Europe/Berlin }
      responses:
        "200":
          description: The suggestion
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string }
                  reason: { type: string, enum: [pattern, steady, idle, insufficient] }
                  schedules: { type: array, items: { $ref: "#/components/schemas/ScalingSchedule" } }
                  upShare: { type: number }
                  busy: { type: array, description: "7 days (Sunday first) of 24 booleans: hours with activity." }
                  up: { type: array, description: "7 days of 24 booleans: hours the suggested schedules keep up." }
                  days: { type: integer }
                  timezone: { type: string }
                  monthlySaving: { type: number }
                  currency: { type: string }
                  source: { type: string, enum: [victoriametrics, costdeck] }
        "400": { description: Unknown time zone }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/namespaces/{ns}/history:
    get:
      x-role: viewer
      tags: [Namespaces]
      summary: Usage history
      description: >-
        Resource usage, requests and limits over a window. The last hour comes from the
        operator itself, one point a minute. Longer windows come from VictoriaMetrics,
        averaged per step (10 minutes for a day, an hour for a week) and capped at its
        retentionDays; without VictoriaMetrics, or when it has nothing for the namespace,
        the answer falls back to the last hour. Requests and limits need kube-state-metrics
        in VictoriaMetrics; without it, the current ones are repeated.
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - name: range
          in: query
          description: Window as hours or days, such as 1h (default), 24h or 7d.
          schema: { type: string, pattern: "^[0-9]+[hd]$", example: 7d }
      responses:
        "200":
          description: History data points, oldest first
          headers:
            X-History-Range:
              description: The window actually covered, such as 1h or 7d.
              schema: { type: string }
            X-History-Source:
              description: Where the points come from, costdeck (its own last hour) or victoriametrics.
              schema: { type: string, enum: [costdeck, victoriametrics] }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryPoint"
        "400":
          description: The range is not a number of hours or days
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/namespaces/{ns}/pods:
    get:
      x-role: viewer
      tags: [Namespaces]
      summary: Pod metrics
      description: Pod-level resource metrics for the namespace.
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Pod list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PodDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/namespaces/{ns}/workloads:
    get:
      x-role: viewer
      tags: [Namespaces]
      summary: List workloads
      description: Lists Deployments and StatefulSets in the namespace.
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Workload list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkloadDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/namespaces/{ns}/workloads/{name}:
    put:
      x-role: operator
      tags: [Namespaces]
      summary: Scale workload
      description: Set replica count for a specific Deployment or StatefulSet.
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [Deployment, StatefulSet]
                replicas:
                  type: integer
      responses:
        "200":
          description: Scaled successfully
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/namespaces/{ns}/revert:
    post:
      x-role: operator
      tags: [Right-sizing]
      summary: Undo an earlier automatic right-sizing
      deprecated: true
      description: >-
        Versions up to 1.3 could rewrite requests and limits automatically. This restores the
        values from before that change. Cost Deck no longer changes requests itself, so this
        only matters for namespaces changed by an earlier version.
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Reverted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/namespaces/{ns}/rightsizing/apply:
    post:
      x-role: operator
      tags: [Namespaces]
      summary: Apply a workload's right-sizing advice
      description: >-
        Sets the workload's pod requests to the recommended ones (never above a limit), which
        rolls its pods, and records the old ones in its NamespaceOptimization. The guard puts
        them back if a new pod is OOMKilled, restarts or crash-loops within
        spec.rightsizing.guardMinutes. Needs spec.rightsizing.apply; refuses workloads a GitOps
        tool manages.
      parameters: &nsParam
        - { name: ns, in: path, required: true, schema: { type: string } }
      requestBody: &workloadBody
        required: true
        content:
          application/json:
            schema: { type: object, required: [kind, name], properties: { kind: { type: string, enum: [Deployment, StatefulSet, Rollout] }, name: { type: string } } }
      responses:
        "200": { description: The change on record }
        "400": { description: The advice changes nothing, or the workload cannot be changed }
        "403": { description: Applying advice is off }
        "404": { description: No advice for the workload }
        "409": { description: A GitOps tool manages the workload }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/namespaces/{ns}/rightsizing/revert:
    post:
      x-role: operator
      tags: [Namespaces]
      summary: Put a workload's old requests back
      parameters: *nsParam
      requestBody: *workloadBody
      responses:
        "200": { description: The change, now reverted }
        "404": { description: No change on record for the workload }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/namespaces/{ns}/rightsizing/pull-request:
    post:
      x-role: operator
      tags: [Namespaces]
      summary: Open a pull request with a workload's advice
      description: >-
        Finds the workload's manifest in the repository of spec.rightsizing.git (plain YAML or
        kustomize; not Helm values), sets its containers' requests, keeping comments, and opens a
        pull request on GitHub, GitLab or Gitea with the evidence behind the advice.
      parameters: *nsParam
      requestBody: *workloadBody
      responses:
        "200": { description: The proposal on record, with its pullRequest URL }
        "400": { description: The advice changes nothing, or no manifest of the workload is in the repository }
        "403": { description: No repository is set up }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/namespaces/{ns}/recommendations:
    get:
      x-role: viewer
      tags: [Right-sizing]
      summary: Right-sizing recommendations
      description: >-
        Compares each container's requests with observed demand: p95 CPU and peak memory over
        up to 14 days when VictoriaMetrics is connected, otherwise a single metrics-server
        reading with a larger margin. Read-only; results are cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendations"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: No usage data is available for the namespace.

  /api/namespaces/{ns}/risks:
    get:
      x-role: viewer
      tags: [Right-sizing]
      summary: Performance risks
      description: >-
        What holds a namespace's workloads back or makes them unstable: CPU throttling, OOM kills,
        restarts with their reason, evictions, memory close to the limit, HorizontalPodAutoscalers
        that want more replicas than their maximum, and JVM heaps still full after garbage
        collection. Current pod and HorizontalPodAutoscaler state is always read; CPU throttling
        and the last 14 days of OOM kills, restarts and evictions need VictoriaMetrics with
        cAdvisor and kube-state-metrics series. Each risk says how to fix it and what the fix
        adds to the monthly cost. Right-sizing advice never reduces a resource under pressure.
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Risks, most severe first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Risks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: The namespace's workloads could not be listed.

  /api/namespaces/{ns}/optimization:
    get:
      x-role: viewer
      tags: [Right-sizing]
      summary: Earlier automatic right-sizing
      deprecated: true
      description: >-
        Whether an automatic right-sizing made by version 1.3 or earlier is still in effect,
        with the values before and after. Undo it with POST /api/namespaces/{ns}/revert.
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Optimization info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizationStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/namespace-selector:
    get:
      x-role: viewer
      tags: [Scaling]
      summary: Preview a namespace selector
      description: >-
        Parses a label selector in kubectl's syntax and returns it as a ScalingGroup stores it
        in spec.namespaceSelector, with the namespaces it matches now. Namespaces labelled
        costdeck.io/schedule=off and the operator's own are never matched.
      parameters:
        - { name: selector, in: query, required: true, schema: { type: string }, example: "env=preview,team in (shop,payments),!legacy" }
      responses:
        "200":
          description: The parsed selector and its matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  selector: { type: object, description: "A Kubernetes LabelSelector (matchLabels, matchExpressions)." }
                  namespaces: { type: array, items: { type: string } }
        "400": { description: The selector cannot be parsed }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/scaling/preview:
    post:
      x-role: viewer
      tags: [Scaling]
      summary: Preview a schedule
      description: >-
        What a schedule would do, saved or not, without changing anything: the namespaces it
        would take (listed or selected by label, and those another group keeps), the
        workloads, CronJobs and operator-run services (hibernate rules) it would stop with the
        workload rules applied, the timetable
        for the next 14 days with exceptions, the share of time up over four weeks, and the
        estimated saving at the current rates. name is the schedule being edited, so it does
        not conflict with itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, spec]
              properties:
                kind: { type: string, enum: [group, config] }
                name: { type: string }
                spec: { type: object, description: "The spec of a ScalingGroup or ScalingConfig as the editor holds it." }
            example:
              kind: group
              spec:
                namespaceSelector: { matchLabels: { env: preview } }
                schedules: [{ days: [1, 2, 3, 4, 5], startTime: "08:00", endTime: "19:00", timezone: Europe/Berlin }]
                calendars: [de-holidays]
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespaces: { type: array, items: { type: object } }
                  cloudTargets: { type: array, items: { $ref: "#/components/schemas/ExternalTarget" } }
                  intervals:
                    type: array
                    items:
                      type: object
                      properties:
                        from: { type: string, format: date-time }
                        to: { type: string, format: date-time }
                        active: { type: boolean }
                        reason: { type: string, description: "schedule, or the name of the exception in force" }
                  upShare: { type: number }
                  nextChange: { type: string, format: date-time }
                  savings:
                    type: object
                    properties:
                      hourly: { type: number }
                      monthly: { type: number }
                      currency: { type: string }
                      basis: { type: string }
                  problems: { type: array, items: { type: string } }
                  warnings: { type: array, items: { type: string } }
        "400": { description: Invalid request }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/scaling/groups:
    get:
      x-role: viewer
      tags: [Scaling]
      summary: List scaling groups
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScalingGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      x-role: admin
      tags: [Scaling]
      summary: Create scaling group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScalingGroup"
      responses:
        "201":
          description: Group created
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/scaling/groups/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      x-role: viewer
      tags: [Scaling]
      summary: Get scaling group
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScalingGroup"
    put:
      x-role: admin
      tags: [Scaling]
      summary: Update scaling group
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScalingGroup"
      responses:
        "200":
          description: Group updated
    delete:
      x-role: admin
      tags: [Scaling]
      summary: Delete scaling group
      responses:
        "204":
          description: Group deleted

  /api/scaling/groups/{name}/manual:
    post:
      x-role: operator
      tags: [Scaling]
      summary: Start now, scale down now, or follow the schedule
      description: >-
        The "Start now", "Scale down now" and "Follow schedule" buttons. An override without
        activeUntil or until holds until it is cleared with {"active": null}.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                  nullable: true
                  description: >
                    true forces scale up, false forces scale down, null clears the override
                    and hands control back to the schedule.
                activeUntil:
                  type: string
                  format: date-time
                  description: >
                    Optional deadline. The override is honoured until this timestamp, after
                    which the schedule takes over again. Must be in the future.
                until:
                  type: string
                  example: nextTransition
                  description: >
                    Relative alternative to activeUntil: "nextTransition" holds the override
                    until the schedule would change state on its own, or a Go duration such
                    as "4h". Clearing the override (active null) also removes the legacy
                    costdeck.io/manual-override annotation.
            examples:
              startUntilNextChange:
                summary: Start now, until the next scheduled change
                value: { active: true, until: nextTransition }
              downForFourHours:
                summary: Scale down for four hours
                value: { active: false, until: 4h }
              followSchedule:
                summary: Follow the schedule again
                value: { active: null }
      responses:
        "200":
          description: Override applied
        "400":
          description: Invalid deadline or duration

