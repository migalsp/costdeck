                properties:
                  resources: { type: array, items: { type: object } }
                  errors: { type: object, additionalProperties: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/discovery/{provider}/{type}:
    get:
      x-role: viewer
      tags: [Costing]
      summary: Discover cloud resources of one type
      description: Lists resources that can join a schedule's start order. Types are aurora and ec2 (aws), vm, postgres and mysql (azure), gce and cloudsql (gcp).
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [aws, azure, gcp] } }
        - { name: type, in: path, required: true, schema: { type: string, enum: [aurora, ec2, vm, postgres, mysql, gce, cloudsql] } }
      responses:
        "200":
          description: Discovered resources
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    provider: { type: string }
                    type: { type: string }
                    identifier: { type: string }
                    name: { type: string }
                    region: { type: string }
                    status: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { description: Provider not supported }

  /api/reports:
    get:
      x-role: viewer
      tags: [Reports]
      summary: Report history and digest schedule
      description: Stored reports (AI reports and sent digests), newest first, with the digest schedule, when it was last sent and when it is due next.
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports: { type: array, items: { $ref: "#/components/schemas/ReportEntry" } }
                  schedule: { $ref: "#/components/schemas/DigestSchedule" }
                  webexReady: { type: boolean, description: Webex is enabled with a space to post to. }
                  channels: { type: array, items: { type: string }, description: The channels that take digests, such as Webex, Slack, Teams or email. }
                  lastSent: { type: string, format: date-time }
                  nextDue: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/reports/digest:
    get:
      x-role: viewer
      tags: [Reports]
      summary: Cost digest
      description: >-
        The seven days up to yesterday, or the last calendar month, against the period
        before: node cost, requested and used,
        schedule savings, the most expensive namespaces and teams, and the top opportunities.
        Computed from the cost history, with the same text that is posted to Webex.
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [week, month], default: week } }
      responses:
        "200":
          description: Digest and its Markdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  digest: { type: object }
                  markdown: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/reports/digest/send:
    post:
      x-role: operator
      tags: [Reports]
      summary: Send the digest to the notification channels now
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                period: { type: string, enum: [week, month] }
            example: { period: week }
      responses:
        "200":
          description: Posted and stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportEntry" }
        "400": { description: No notification channel takes digests }
        "502": { description: Every channel rejected the message }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/reports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      x-role: viewer
      tags: [Reports]
      summary: One stored report
      responses:
        "200":
          description: The report and its Markdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  report: { $ref: "#/components/schemas/ReportEntry" }
                  markdown: { type: string }
        "404": { description: No such report }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      x-role: admin
      tags: [Reports]
      summary: Delete a stored report
      responses:
        "204": { description: Deleted }
        "404": { description: No such report }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/ai/chat:
    post:
      x-role: viewer
      tags: [AI]
      summary: Chat with the assistant
      description: >-
        Streams the answer as Server-Sent Events. Each `data:` line is a JSON event of type
        text, reset, tool_call, tool_result, confirm, error or done. A `confirm` event names a
        mutating tool the model wants to run; nothing happens until the client calls
        POST /api/ai/tools/{name}. Every answer's tokens count against the monthly token
        budget (spec.integrations.ai.monthlyTokenBudget); once it is spent the request is
        refused with 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  type: { type: string }
                  text: { type: string }
                  tool: { type: string }
                  args: { type: object }
                  isError: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: "The assistant's monthly token budget is spent" }

  /api/ai/tools/{name}:
    post:
      x-role: operator
      tags: [AI]
      summary: Run a confirmed assistant action
      description: Runs a mutating tool (scale_group, scale_namespace, revert_optimization) the user confirmed. Requires the operator role.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                args: { type: object }
      responses:
        "200":
          description: Result text
          content:
            application/json:
              schema: { type: object, properties: { result: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Requires the operator role }

  /api/ai/report:
    get:
      x-role: viewer
      tags: [AI]
      summary: Saved cost report
      responses:
        "200":
          description: The last saved report (empty when none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  report: { type: string, description: Markdown }
                  generatedAt: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/ai/report/generate:
    post:
      x-role: operator
      tags: [AI]
      summary: Generate a cost report
      description: >-
        Streams a new Markdown report as Server-Sent Events (same event format as chat),
        written by the AI model from the same overview, digest and node data the dashboard
        shows, for the chosen audience. When done it is stored in the report history and a
        "saved" event carries its ID.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                audience: { type: string, enum: [executive, engineering, showback], default: executive }
            example: { audience: engineering }
      responses:
        "200": { description: Event stream, content: { text/event-stream: {} } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: "The assistant's monthly token budget is spent" }

  /api/ai/report/save:
    post:
      x-role: operator
      tags: [AI]
      summary: Save an edited report
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { report: { type: string } } }
      responses:
        "200": { description: Saved }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/settings:
    get:
      x-role: viewer
      tags: [Settings]
      summary: Read settings
      description: The CostDeckConfig settings with connection status. Credentials are never returned, only whether they are set.
      responses:
        "200": { description: Settings, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      x-role: admin
      tags: [Settings]
      summary: Update settings
      description: >-
        Updates the sections present in the body (providers, integrations, features, pricing,
        auth, budgets, alerts, billing, reports, calendars). Omitted credential fields keep the
        stored Secret. Requires the admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            examples:
              victoriaMetrics:
                summary: Connect VictoriaMetrics
                value:
                  integrations:
                    victoriaMetrics: { enabled: true, endpoint: "http://vmselect.monitoring:8481/select/0/prometheus", retentionDays: 14 }
              customRates:
                summary: Use your own prices
                value:
                  pricing: { cpuCoreHour: "0.031", memoryGiBHour: "0.0042", currency: EUR }
              budget:
                summary: A team budget with alerts at 80% and 100%
                value:
                  budgets:
                    - { name: payments, scope: team, value: payments, monthlyLimit: "1200", thresholds: [80, 100], forecast: true }
                  alerts:
                    anomalies: { enabled: true, percent: 30, minimumDaily: "5" }
                    performanceRisks: { enabled: true }
              calendars:
                summary: Public holidays that schedules name in spec.calendars
                value:
                  calendars:
                    - name: de-holidays
                      timezone: Europe/Berlin
                      days: [{ date: "2026-12-25", name: Christmas Day }, { date: "2026-12-26", name: Boxing Day }]
              billing:
                summary: Reconcile with AWS Cost Explorer
                value:
                  billing: { enabled: true, aws: { tagKey: "aws:eks:cluster-name", tagValue: prod-eu } }
              weeklyDigest:
                summary: Post the cost digest every Monday
                value:
                  reports:
                    digest: { enabled: true, frequency: weekly, time: "09:00", timezone: Europe/Berlin }
              azure:
                summary: Enable Azure with workload identity
                value:
                  providers:
                    azure: { enabled: true, subscriptionId: "00000000-0000-0000-0000-000000000000", resourceTypes: [vm, postgres] }
      responses:
        "200": { description: Updated settings, content: { application/json: { schema: { type: object } } } }
        "400": { description: Invalid settings }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/settings/providers/{provider}/test:
    post:
      x-role: admin
      tags: [Settings]
      summary: Test a connection
      description: >-
        Tests unsaved credentials or settings. For cloud providers it also reports how many
        resources discovery finds. For slack, teams and email it sends a test message, with
        the body shaped like integrations.notifications of the settings update.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [aws, azure, gcp, ai, entra, oidc, webex, slack, teams, email, cluster, victoriametrics] } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: { type: boolean }
                  message: { type: string }
                  error: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/settings/providers/{provider}/status:
    get:
      x-role: viewer
      tags: [Settings]
      summary: Connection status of a configured provider
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Status, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/settings/ai/models:
    post:
      x-role: admin
      tags: [Settings]
      summary: List AI models
      description: Asks the AI provider (with the given or stored credentials) which models it offers.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [anthropic, openai, gemini, local] }
                baseUrl: { type: string }
                apiKey: { type: string }
      responses:
        "200":
          description: Models
          content:
            application/json:
              schema:
                type: object
                properties:
                  models: { type: array, items: { type: string } }
                  default: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/tokens:
    get:
      x-role: admin
      tags: [Settings]
      summary: List API tokens
      responses:
        "200":
          description: Tokens (never the token values)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TokenInfo" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      x-role: admin
      tags: [Settings]
      summary: Create an API token
      description: The token value is returned once and only its hash is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: { type: string }
                role: { type: string, enum: [viewer, operator, admin] }
                expiresInDays: { type: integer, minimum: 0, maximum: 3650, description: "0 = never" }
            example: { name: ci-pipeline, role: operator, expiresInDays: 90 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: cdk_... }
                  info: { $ref: "#/components/schemas/TokenInfo" }
        "400": { description: Invalid request }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/tokens/{name}:
    delete:
      x-role: admin
      tags: [Settings]
      summary: Revoke an API token
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/users:
    get:
      x-role: admin
      tags: [Users]
      summary: List users
      description: Local users, the built-in admin account and the last sign-in of everyone, single sign-on users included.
      responses:
        "200":
          description: Users and sign-ins
          content:
            application/json:
              schema:
                type: object
                properties:
                  builtin:
                    type: object
                    nullable: true
                    properties:
                      username: { type: string, example: costdeck }
                      secret: { type: string, example: costdeck/costdeck-operator-admin-credentials }
                  users: { type: array, items: { $ref: "#/components/schemas/User" } }
                  signIns: { type: array, items: { $ref: "#/components/schemas/SignIn" } }
                  sso: { type: boolean, description: Single sign-on is enabled }
                  minPasswordLength: { type: integer, example: 12 }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      x-role: admin
      tags: [Users]
      summary: Create a local user
      description: Without a password one is generated and returned once. By default the user chooses a new password at the first sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role]
              properties:
                username: { type: string, pattern: "^[a-z0-9]([a-z0-9._-]{0,61}[a-z0-9])?$" }
                name: { type: string }
                email: { type: string }
                role: { type: string, enum: [viewer, operator, admin] }
                password: { type: string, minLength: 12 }
                mustChangePassword: { type: boolean, default: true }
            example: { username: anna, name: Anna Petrova, role: operator }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  password: { type: string, description: Only when it was generated }
        "400": { description: Invalid name, role or password, or the name is taken }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/users/{username}:
    patch:
      x-role: admin
      tags: [Users]
      summary: Update a local user
      description: Changes the name, email, role or disabled flag. Disabling ends the user's sessions; a new role applies within 30 seconds. Administrators cannot disable or demote themselves.
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                role: { type: string, enum: [viewer, operator, admin] }
                disabled: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { description: No such user }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      x-role: admin
      tags: [Users]
      summary: Delete a local user
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted; the user's sessions end }
        "404": { description: No such user }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/users/{username}/password:
    post:
      x-role: admin
      tags: [Users]
      summary: Reset a local user's password
      description: Without a password one is generated and returned once. The user's sessions end.
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, minLength: 12 }
                mustChangePassword: { type: boolean, default: true }
      responses:
        "200":
          description: Reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  password: { type: string, description: Only when it was generated }
        "404": { description: No such user }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/webex/webhook:
    post:
      tags: [Webex]
      summary: Webex webhook
      description: Receives Webex message events when a webhook secret is configured. The body must carry a valid HMAC-SHA1 X-Spark-Signature; no session or token is needed.
      security: []
      parameters:
        - { name: X-Spark-Signature, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: Accepted }
        "401": { description: Missing or invalid signature }

  /api/openapi.yaml:
    get:
      tags: [Docs]
      security: []
      summary: OpenAPI specification (YAML)
      responses:
        "200":
          description: This document
          content:
            application/x-yaml: {}

  /api/openapi.json:
    get:
      tags: [Docs]
      security: []
      summary: OpenAPI specification (JSON)
      responses:
        "200":
          description: This document as JSON
          content:
            application/json: {}

  /api/docs:
    get:
      tags: [Docs]
      security: []
      summary: Swagger UI
      description: Interactive documentation where requests can be tried out.
      responses:
        "200":
          description: HTML page
          content:
            text/html: {}

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: costdeck-session
    bearerAuth:
      type: http
      scheme: bearer
      description: API token (cdk_...) from Settings → API tokens.
  parameters:
    Namespace:
      name: ns
      in: path
      required: true
      description: Target namespace name
      schema:
        type: string

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ClusterSummary:
      type: object
      properties:
        name: { type: string }
        generatedAt: { type: string, format: date-time }
        currency: { type: string }
        nodes: { type: integer }
        namespaces: { type: integer }
        monthlyCost: { type: number }
        monthlyRequested: { type: number }
        monthlyUsed: { type: number }
        monthlyUnallocated: { type: number }
        schedulesSaving: { type: number }
        savingsAvailable: { type: number }
        monthToDate: { type: number }
        forecast: { type: number }
        schedules: { type: integer }
        schedulesDown: { type: integer }
    Error:
      type: object
      properties:
        error:
          type: string
          example: Authentication required

    NodeMetrics:
      type: object
      properties:
        name:
          type: string
        cpuCapacity:
          type: string
        cpuUsage:
          type: string
        memoryCapacity:
          type: string
        memoryUsage:
          type: string
        pods:
          type: integer

    HealthCurrent:
      type: object
      properties:
        status:
          type: string
          example: healthy
        goroutines:
          type: integer
        cpuUsage:
          type: number
        memoryUsage:
          type: number
        gcCycles:
          type: integer
        managedNamespaces:
          type: integer
        cpuRequests:
          type: number
        cpuLimits:
          type: number
        memoryRequests:
          type: number
        memoryLimits:
          type: number

    ResourceMetrics:
      type: object
      properties:
        usage:
          type: string
        requests:
          type: string
        limits:
          type: string

    HistoryPoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        cpu:
          $ref: "#/components/schemas/ResourceMetrics"
        memory:
          $ref: "#/components/schemas/ResourceMetrics"

    PodDetail:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        cpu:
          $ref: "#/components/schemas/ResourceMetrics"
        memory:
          $ref: "#/components/schemas/ResourceMetrics"

    WorkloadDetail:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [Deployment, StatefulSet]
        replicas:
          type: integer
        readyReplicas:
          type: integer
        status:
          type: string

    NamespaceFinOps:
      type: object
      properties:
        metadata:
          type: object
          properties:
            name:
              type: string
            namespace:
              type: string
        spec:
          type: object
          properties:
            targetNamespace:
              type: string
        status:
          type: object
          properties:
            insights:
              type: array
              items:
                type: string

    Recommendations:
      type: object
      properties:
        namespace: { type: string }
        source: { type: string, enum: [victoriametrics, metrics-server] }
        historical: { type: boolean, description: "true for p95/peak over a window, false for a single reading" }
        window: { type: string, example: 14d }
        basis: { type: string }
        warning: { type: string }
        currency: { type: string, example: USD }
        monthlySavings: { type: number }
        javaMonthlySavings: { type: number, description: "What lowering oversized JVM heaps would save, a separate change from the request advice" }
        workloads:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [Deployment, StatefulSet, Rollout] }
              name: { type: string }
              replicas: { type: integer }
              monthlySavings: { type: number }
              policy: { type: string, description: "The RightsizingPolicy that bounds this workload's advice" }
              applyForbidden: { type: boolean, description: "Its policy forbids applying the advice or proposing it" }
              containers:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    cpu: { $ref: "#/components/schemas/ResourceAdvice" }
                    memory: { $ref: "#/components/schemas/ResourceAdvice" }
                    jvm: { $ref: "#/components/schemas/JVMAdvice" }
    JVMAdvice:
      type: object
      description: >
        How a Java container's JVM is set up and what that means for its memory. Present for
        containers that run Java: found by the java command, JAVA_TOOL_OPTIONS, JDK_JAVA_OPTIONS,
        JAVA_OPTS or _JAVA_OPTIONS, a JVM image, JVM metrics in VictoriaMetrics, or the
        costdeck.io/runtime annotation (java or none) on the workload or its pod template.
      properties:
        detectedBy: { type: string, enum: [annotation, command, options, image, metrics] }
        options: { type: array, items: { type: string }, example: ["-Xmx2g", "-XX:+UseG1GC"] }
        heap: { type: string, example: 2Gi, description: "The heap the JVM can grow to; absent when it depends on the node" }
        heapSource: { type: string, example: "set by -Xmx" }
        heapUsed: { type: string, example: 1800Mi, description: "Peak heap in use, from JVM metrics" }
        heapAfterGC: { type: string, example: 400Mi, description: "Peak heap left after garbage collection, from JVM metrics" }
        nonHeap: { type: string, example: 160Mi }
        recommendedHeap: { type: string, example: 800Mi }
        recommendedMemory: { type: string, example: 1056Mi, description: "The memory request and limit to pair with the recommended heap" }
        recommendedOptions: { type: string, example: "-Xmx800m" }
        monthlySavings: { type: number }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [risk, waste, note] }
              code:
                type: string
                enum: [container-support-off, no-memory-limit, heap-over-limit, no-room-for-native, default-heap,
                  request-below-heap, heap-tight, heap-oversized, heap-differs, serial-gc, unread-options]
              message: { type: string }
    User:
      type: object
      properties:
        username: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [viewer, operator, admin] }
        disabled: { type: boolean }
        mustChangePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        passwordChangedAt: { type: string, format: date-time }
    SignIn:
      type: object
      properties:
        subject: { type: string, example: "entra:7f3c..." }
        name: { type: string }
        email: { type: string }
        provider: { type: string, enum: [local, entra] }
        role: { type: string, enum: [viewer, operator, admin] }
        at: { type: string, format: date-time }
        count: { type: integer }
    TokenInfo:
      type: object
      properties:
        name: { type: string }
        role: { type: string, enum: [viewer, operator, admin] }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        expiresAt: { type: string, format: date-time }
    ResourceAdvice:
      type: object
      properties:
        request: { type: string, example: "1" }
        observed: { type: string, example: 100m }
        recommended: { type: string, example: 120m }
        action: { type: string, enum: [reduce, increase, keep, set, unknown] }
        held: { type: string, example: "throttled in 30% of CPU periods at busy times", description: "Why a reduction is held back: the resource is under pressure" }
    Risks:
      type: object
      properties:
        namespace: { type: string }
        historical: { type: boolean, description: "true when VictoriaMetrics history was read" }
        window: { type: string, example: 14d }
        basis: { type: string }
        warning: { type: string }
        currency: { type: string, example: USD }
        risks:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [Deployment, StatefulSet, Rollout] }
              workload: { type: string }
              container: { type: string }
              severity: { type: string, enum: [critical, warning] }
              code:
                type: string
                description: cpu-throttled, oom-killed, restarts, evicted, memory-near-limit, hpa-at-max, or a JVM finding code such as heap-tight
              message: { type: string }
              fix: { type: string }
              fixMonthlyCost: { type: number, description: "What the fix adds to the monthly cost; 0 for limits, which are not billed; absent when unknown" }
    OptimizationStatus:
      type: object
      properties:
        active:
          type: boolean
        optimizedAt:
          type: string
          format: date-time
        workloads:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              kind:
                type: string
              original:
                $ref: "#/components/schemas/ResourceValues"
              optimized:
                $ref: "#/components/schemas/ResourceValues"

    ResourceValues:
      type: object
      properties:
        cpuRequest:
          type: string
        cpuLimit:
          type: string
        memoryRequest:
          type: string
        memoryLimit:
          type: string

    ScalingGroup:
      type: object
      description: A schedule for a set of namespaces and cloud resources (kind ScalingGroup).
      example:
        metadata: { name: dev }
        spec:
          category: Environments
          namespaces: [dev-frontend, dev-backend]
          schedules:
            - { days: [1, 2, 3, 4, 5], startTime: "08:00", endTime: "19:00", timezone: Europe/Berlin }
          dependsOn: [platform]
          sequence: [dev-backend, dev-frontend]
      properties:
        metadata:
          type: object
          properties:
            name: { type: string, description: "Lowercase letters, digits and dashes." }
        spec:
          type: object
          required: [category]
          properties:
            category:
              type: string
              description: Section the schedule is listed under, for example Platform or Environments.
            namespaces:
              type: array
              items: { type: string }
              description: Namespaces listed by name. Optional when namespaceSelector is set.
            namespaceSelector:
              type: object
              description: >-
                A Kubernetes LabelSelector. Every namespace it matches joins the group (the matches
                are in status.selectedNamespaces), except the operator's own and those labelled
                costdeck.io/schedule=off. A group that lists a namespace by name wins over one that
                selects it; otherwise the older group wins. When a namespace stops matching, the
                group restores what it scaled down there.
              example: { matchLabels: { env: preview } }
            schedules:
              type: array
              description: When the namespaces run. Windows are OR-ed; outside all of them everything is scaled down.
              items: { $ref: "#/components/schemas/ScalingSchedule" }
            exceptions:
              type: array
              description: >-
                Dates on which the schedules do not apply: a holiday the target stays down, or a
                release weekend it stays up. A manual override still wins; of overlapping
                exceptions the one that began last applies.
              items: { $ref: "#/components/schemas/ScheduleException" }
            calendars:
              type: array
              items: { type: string }
              description: Shared holiday calendars (settings, calendars) whose days apply as exceptions too.
            dryRun:
              type: boolean
              description: >-
                Work out what the schedule would do and report it (phase DryRun and the DryRun
                condition) without scaling anything.
            pauseGitOps:
              type: boolean
              description: >-
                Suspend the Flux Kustomizations and HelmReleases and turn off self-heal of the Argo
                CD Applications that manage the workloads while they are down, and resume them
                afterwards. Needs gitops.pause in the Helm chart.
            sleepPage:
              type: boolean
              description: >-
                Point the namespaces' Gateway API HTTPRoutes at Cost Deck's sleep page while the
                schedule keeps them down, and back once they are up. Needs sleepPage.enabled in the
                Helm chart.
            prewarm:
              type: object
              description: >-
                Start the workloads ahead of each scheduled start: by minutes (up to 120), or with
                auto by the slowest of the last five wake-ups plus a minute, at most 30 minutes.
              properties:
                auto: { type: boolean }
                minutes: { type: integer, minimum: 0, maximum: 120 }
            idleAfter:
              type: string
              example: 1h
              description: >-
                Scale the namespaces down inside the schedule's hours once no request reached them
                and no GPU was busier than 5% for this long (a duration such as 30m or 2h),
                counted from Envoy Gateway, Istio or ingress-nginx and DCGM metrics in
                VictoriaMetrics. They stay down until the schedule next starts them, at most a
                week, or a manual start.
            hibernate:
              type: array
              description: >-
                Services operators run in every namespace of the group, such as databases, to stop
                after the workloads and start before them. Added to each namespace's own rules.
              items: { $ref: "#/components/schemas/HibernateRule" }
            activation:
              type: string
              enum: [Schedule, OnDemand]
              description: OnDemand has no hours of its own and runs only while a schedule that depends on it needs it.
            dependsOn:
              type: array
              items: { type: string }
              description: Schedules this one starts after. They are kept up while this one runs.
            sequence:
              type: array
              items: { type: string }
              description: >-
                Start order. Each entry is a stage of space-separated namespaces or ext:<identifier>
                cloud resources. Stages start top to bottom and stop bottom to top; namespaces in no
                stage start last.
            externalTargets:
              type: array
              items: { $ref: "#/components/schemas/ExternalTarget" }
            featureFlags:
              type: object
              properties:
                skipOnTimeout: { type: boolean, description: "Move on when a namespace is not ready in time." }
                timeoutMinutes: { type: integer, minimum: 1, maximum: 30, default: 5 }
            active:
              type: boolean
              nullable: true
              description: >-
                Manual override, normally set through the /manual endpoint. Absent (null) means
                the schedule is followed; false does not mean "follow the schedule", it keeps the
                namespaces down.
            activeUntil:
              type: string
              format: date-time
              description: When the manual override ends by itself.
        status:
          type: object
          description: >-
            Written by the operator. phase is ScaledUp, ScalingUp, ScalingDown, ScaledDown or
            WaitingForDependencies; mode says what decides the state (Schedule, ManualUp,
            ManualDown, Exception, AlwaysOn, Dependency, OnDemand, Idle, Prewarm). While mode is
            Exception, exception names it and exceptionEndsAt says when it ends; while it is
            Idle, idleUntil says when the schedule takes over again. recentWakeUps are the last
            five scale-ups from zero with how long each took until every target was ready, and
            prewarmMinutes is how far ahead of each scheduled start spec.prewarm starts them.

    ScalingConfig:
      type: object
      description: >-
        A schedule for a single namespace (kind ScalingConfig). The dashboard uses it for
        workload rules on a namespace. A namespace that belongs to a ScalingGroup follows the
        group; its config then only contributes exclusions and workload order.
      example:
        metadata: { name: dev-backend }
        spec:
          targetNamespace: dev-backend
          exclusions: [redis-*]
          sequence: [postgres, "api-* worker"]
      properties:
        metadata:
          type: object
          properties:
            name: { type: string }
        spec:
          type: object
          required: [targetNamespace]
          properties:
            targetNamespace: { type: string, description: "The namespace the schedule scales. It cannot change after creation." }
            featureFlags:
              type: object
              description: >-
                Without skipOnTimeout each stage of the workload sequence waits until its workloads
                are ready. A group that runs this namespace uses its own setting.
              properties:
                skipOnTimeout: { type: boolean, description: "Start the next stage when one is not ready in time." }
                timeoutMinutes: { type: integer, minimum: 1, maximum: 30, default: 5 }
            schedules:
              type: array
              items: { $ref: "#/components/schemas/ScalingSchedule" }
            exceptions:
              type: array
              description: >-
                Dates on which the schedules do not apply: a holiday the target stays down, or a
                release weekend it stays up. A manual override still wins; of overlapping
                exceptions the one that began last applies.
              items: { $ref: "#/components/schemas/ScheduleException" }
            calendars:
              type: array
              items: { type: string }
              description: Shared holiday calendars (settings, calendars) whose days apply as exceptions too.
            dryRun:
              type: boolean
              description: >-
                Work out what the schedule would do and report it (phase DryRun and the DryRun
                condition) without scaling anything.
            pauseGitOps:
              type: boolean
              description: >-
                Suspend the Flux Kustomizations and HelmReleases and turn off self-heal of the Argo
                CD Applications that manage the workloads while they are down, and resume them
                afterwards. Needs gitops.pause in the Helm chart.
            sleepPage:
              type: boolean
              description: >-
                Point the namespaces' Gateway API HTTPRoutes at Cost Deck's sleep page while the
                schedule keeps them down, and back once they are up. Needs sleepPage.enabled in the
                Helm chart.
            prewarm:
              type: object
              description: >-
                Start the workloads ahead of each scheduled start: by minutes (up to 120), or with
                auto by the slowest of the last five wake-ups plus a minute, at most 30 minutes.
              properties:
                auto: { type: boolean }
                minutes: { type: integer, minimum: 0, maximum: 120 }
            idleAfter:
              type: string
              example: 1h
              description: >-
                Scale the namespaces down inside the schedule's hours once no request reached them
                and no GPU was busier than 5% for this long (a duration such as 30m or 2h),
                counted from Envoy Gateway, Istio or ingress-nginx and DCGM metrics in
                VictoriaMetrics. They stay down until the schedule next starts them, at most a
                week, or a manual start.
            hibernate:
              type: array
              description: >-
                Services operators run in the namespace, such as databases, to stop after the
                workloads and start before them. Groups apply them too (workload rules).
              items: { $ref: "#/components/schemas/HibernateRule" }
            exclusions:
              type: array
              items: { type: string }
              description: Workloads that never scale down, by name or prefix glob ("redis-*").
            sequence:
              type: array
              items: { type: string }
              description: Workload start order. Each entry is a stage of space-separated name globs.
            active:
              type: boolean
              nullable: true
              description: Manual override; absent (null) means the schedule is followed.
            activeUntil:
              type: string
              format: date-time

    FinOpsOverview:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        currency: { type: string, example: USD }
        monthly:
          type: object
          description: Monthly amounts at the current run rate.
          properties:
            provisioned: { type: number, description: What the nodes cost. }
            requested: { type: number, description: The part reserved by pod requests. }
            used: { type: number, description: What pods actually use. }
            unallocated: { type: number, description: Node capacity no pod requests. }
            overprovisioned: { type: number, description: Requested but unused. }
        savings:
          type: object
          properties:
            schedulesMonthly: { type: number, description: What the schedules keep down now, per month. }
            rightsizingMonthly: { type: number }
            rightsizingPending: { type: integer }
            scheduleCandidatesMonthly: { type: number, description: What working hours on unscheduled non-production namespaces would save. }
        monthToDate:
          type: object
          properties:
            month: { type: string, example: "2026-10" }
            cost: { type: number }
            saved: { type: number }
            forecast: { type: number }
            partial: { type: boolean, description: The history does not cover the whole month so far. }
        history:
          type: object
          properties:
            since: { type: string, format: date-time }
            top: { type: array, items: { type: string } }
            days:
              type: array
              items:
                type: object
                properties:
                  date: { type: string, example: "2026-10-05" }
                  hours: { type: number }
                  provisioned: { type: number }
                  requested: { type: number }
                  used: { type: number }
                  saved: { type: number }
                  namespaces: { type: object, additionalProperties: { type: number } }
        namespaces:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              environment: { type: string, enum: [production, non-production, system, unclassified] }
              team: { type: string }
              pods: { type: integer }
              monthlyCost: { type: number }
              monthlyUsedCost: { type: number }
              monthlyIdle: { type: number }
              efficiency: { type: number, description: Used cost over requested cost. }
              insights: { type: array, items: { type: string } }
              schedule:
                type: object
                properties:
                  kind: { type: string, enum: [group, config] }
                  name: { type: string }
                  desiredState: { type: string }
                  savedMonthly: { type: number }
              rightsizingMonthly: { type: number }
              scheduleSavingMonthly: { type: number }
              cost7d: { type: number }
              costPrev7d: { type: number }
        opportunities:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [rightsizing, schedule, idle-capacity, cost-increase, missing-requests] }
              namespace: { type: string }
              title: { type: string }
              detail: { type: string }
              monthlySavings: { type: number }

    ReportEntry:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [ai, digest] }
        title: { type: string }
        audience: { type: string, enum: [executive, engineering, showback] }
        period: { type: string, enum: [week, month] }
        generatedAt: { type: string, format: date-time }
        by: { type: string }
        delivered: { type: string, example: webex }

    DigestSchedule:
      type: object
      properties:
        enabled: { type: boolean }
        frequency: { type: string, enum: [weekly, monthly], description: "Weekly on Mondays, monthly on the 1st." }
        time: { type: string, example: "09:00" }
        timezone: { type: string, example: Europe/Berlin }

    Budget:
      type: object
      required: [name, scope, monthlyLimit]
      properties:
        name: { type: string, example: payments }
        scope: { type: string, enum: [cluster, namespace, team, environment] }
        value: { type: string, description: "Team label value or environment; empty for cluster. Older namespace budgets keep their one namespace here.", example: payments }
        namespaces: { type: array, maxItems: 500, items: { type: string }, description: "The namespaces a namespace budget covers together; stored sorted and without duplicates.", example: [dev-api, dev-web] }
        monthlyLimit: { type: string, example: "1200" }
        thresholds: { type: array, items: { type: integer }, example: [80, 100] }
        forecast: { type: boolean, description: Also alert when the month is forecast to exceed the limit. }

    ExternalTarget:
      type: object
      description: A cloud resource started and stopped with the schedule.
      required: [provider, type, identifier]
      properties:
        provider: { type: string, enum: [aws, azure, gcp] }
        type: { type: string, enum: [aurora, ec2, vm, postgres, mysql, gce, cloudsql] }
        identifier:
          type: string
          description: "AWS: cluster identifier or instance ID. Azure: full resource ID. Google Cloud: <zone>/<name> for Compute Engine, the instance name for Cloud SQL."
        region: { type: string }
        name: { type: string, description: Display name. }

    RealizedSavings:
      type: object
      properties:
        state: { type: string, enum: [none, settling, checked] }
        scaledDownAt: { type: string, format: date-time }
        settleMinutes: { type: integer }
        estimatedHourly: { type: number, description: What the stopped workloads' requests cost per hour. }
        realizedHourly: { type: number, description: What the removed nodes cost per hour. }
        currency: { type: string }
        gone: { type: integer }
        blocked: { type: integer }
        nodes:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              hourlyCost: { type: number }
              gone: { type: boolean }
              blockers:
                type: array
                items:
                  type: object
                  properties:
                    reason: { type: string, enum: [node, pdb, do-not-disrupt, safe-to-evict, local-storage, no-controller, custom-controller, kube-system] }
                    pod: { type: string }
                    detail: { type: string }
              tenants: { type: array, items: { type: object } }
              requestedShare: { type: number }
    HibernateRule:
      type: object
      description: >-
        Stops services an operator runs, such as a database: they stop after the namespace's
        workloads and start before them, and the workloads the operator runs for them are left
        to it. Only what CostDeck stopped is started again. Needs hibernation.enabled in the
        Helm chart (hibernation.extraRules for kinds without a preset).
      properties:
        preset:
          type: string
          enum: [cnpg, zalando-postgres, strimzi]
          description: >-
            cnpg hibernates CloudNativePG clusters; zalando-postgres sets numberOfInstances of
            Zalando postgresql clusters to zero; strimzi scales KafkaConnect, KafkaMirrorMaker2 and
            KafkaBridge (Kafka clusters themselves cannot be stopped).
        apiVersion: { type: string, example: redis.example.com/v1, description: "Without a preset: the resources' group/version." }
        kind: { type: string, example: Redis }
        replicasField: { type: string, example: spec.size, description: Dotted path of the replica count. }
        readyField: { type: string, example: status.readyNodes, description: Dotted path of the ready count; without it a resource counts as there once patched. }
        names:
          type: array
          items: { type: string }
          description: Only resources with these names or globs (pg-*); empty means all in the namespace.
    ScheduleException:
      type: object
      required: [start, state]
      example: { name: Christmas break, start: "2026-12-24", end: "2027-01-01", state: Down }
      properties:
        name: { type: string, description: What the exception is for. }
        start:
          type: string
          description: First day ("2026-12-24") or moment ("2026-12-24T18:00") it applies.
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}(T([01][0-9]|2[0-3]):[0-5][0-9])?$'
        end:
          type: string
          description: Last day it applies (the whole day) or the moment it stops. Defaults to the end of the start day.
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}(T([01][0-9]|2[0-3]):[0-5][0-9])?$'
        state: { type: string, enum: [Up, Down] }
        timezone: { type: string, description: "Zone of start and end; defaults to the first schedule's, then UTC." }

    ScalingSchedule:
      type: object
      description: >
        One availability window. Either a daily window (days + startTime/endTime, where an
        endTime earlier than startTime runs overnight into the next day) or a continuous
        multi-day window (startDay/endDay), which may wrap through Sunday.
      properties:
        days:
          type: array
          description: Weekdays the daily window applies to (0 = Sunday). Ignored when startDay/endDay are set.
          items:
            type: integer
            minimum: 0
            maximum: 6
        startDay:
          type: integer
          minimum: 0
          maximum: 6
          description: Weekday a continuous window opens on. Must be set together with endDay.
          example: 1
        endDay:
          type: integer
          minimum: 0
          maximum: 6
          description: Weekday a continuous window closes on. Must be set together with startDay.
          example: 5
        startTime:
          type: string
          example: "08:00"
        endTime:
          type: string
          example: "20:00"
        timezone:
          type: string
          example: Europe/Bratislava
