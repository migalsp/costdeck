        the bill for the days the history covers.
      parameters: &allocationParams
        - { name: by, in: query, schema: { type: string, default: team }, description: "team, environment, namespace or label:<key>" }
        - { name: period, in: query, schema: { type: string, enum: [this-month, last-month, last-7-days, last-30-days], default: this-month } }
        - { name: from, in: query, schema: { type: string, format: date }, description: With to, instead of period. }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency: { type: string }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  by: { type: string }
                  policy: { type: object }
                  days: { type: integer }
                  sharedNamespaces: { type: array, items: { type: string } }
                  unallocated: { type: number }
                  total: { type: number }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        namespaces: { type: array, items: { type: string } }
                        compute: { type: number }
                        storage: { type: number }
                        network: { type: number }
                        shared: { type: number }
                        idle: { type: number }
