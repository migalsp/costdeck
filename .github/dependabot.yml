version: 2

# Dependabot alerts were already enabled, but with no configuration every advisory opened
# its own pull request.
#
# This file groups those security pull requests. Routine version updates stay off for Go,
# npm and Docker: `open-pull-requests-limit: 0` disables them, and that limit does not apply
# to security updates, so an advisory still produces a PR. GitHub Actions get monthly
# version updates as well, since every action is pinned by commit SHA.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Listed first so it wins over the catch-all below: the Kubernetes libraries have to
      # move together or the build breaks on mismatched
      # apimachinery/client-go/controller-runtime versions.
      kubernetes-security:
        applies-to: security-updates
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      go-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"
    groups:
      # The UI is compiled during the container build and only the emitted static assets
      # are embedded, so build-time packages never reach the runtime image. Worth fixing on
      # an advisory, not worth a PR each.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      actions:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    cooldown:
      default-days: 14
    commit-message:
      prefix: "build(deps)"
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
