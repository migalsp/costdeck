name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run for the previous commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go · generate, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # setup-go pins GOTOOLCHAIN=local, so the version must come from go.mod rather than
          # drift below its go directive.
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@v6
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile', '.custom-gcl.yml', 'go.mod') }}

      - name: Generated code and manifests are committed
        run: |
          make manifests generate
          if ! git diff --exit-code; then
            echo "::error::CRDs, RBAC, Helm templates or deepcopy code are stale. Run 'make manifests generate' and commit the result."
            exit 1
          fi

      - name: Lint
        run: make lint

      - name: Test (envtest)
        run: make test

      - name: Formatting is clean
        run: |
          if ! git diff --exit-code; then
            echo "::error::Run 'make fmt' and commit the result."
            exit 1
          fi

      - name: Upload coverage
        if: ${{ !cancelled() && hashFiles('cover.out') != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: cover.out
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage is informative; a Codecov outage must not fail the build.
          fail_ci_if_error: false

  ui:
    name: UI · types, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Lint
        run: |
          helm lint deploy/helm/costdeck-operator --strict
          helm lint deploy/helm/costdeck-operator --strict \
            --set metrics.secure=true,metrics.serviceMonitor.enabled=true,ingress.enabled=true,podDisruptionBudget.enabled=true,replicaCount=2
      - name: Validate rendered manifests
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          helm template costdeck deploy/helm/costdeck-operator -n costdeck \
            | ./kubeconform -strict -summary -ignore-missing-schemas
          helm template costdeck deploy/helm/costdeck-operator -n costdeck \
            --set metrics.secure=true,metrics.serviceMonitor.enabled=true,ingress.enabled=true,podDisruptionBudget.enabled=true \
            | ./kubeconform -strict -summary -ignore-missing-schemas

  install-bundle:
    name: Kustomize install bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build dist/install.yaml
        run: make build-installer IMG=ghcr.io/${{ github.repository }}/costdeck-operator:ci
      - name: Every generated CRD is in the bundle
        run: |
          want=$(ls config/crd/bases/*.yaml | wc -l)
          got=$(grep -c '^kind: CustomResourceDefinition' dist/install.yaml)
          if [ "$got" -ne "$want" ]; then
            echo "::error::dist/install.yaml has $got CRDs but config/crd/bases has $want. Add the missing file to config/crd/kustomization.yaml."
            exit 1
          fi

  vulnerabilities:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm audit (runtime dependencies)
        working-directory: ui
        # Only runtime packages end up in the embedded bundle; build tooling never reaches the
        # image, so dev-only advisories are left to Dependabot.
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E · Kind smoke test
    runs-on: ubuntu-latest
    needs: [go, ui, helm]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: costdeck-operator:e2e
          build-args: VERSION=e2e-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: costdeck-operator:e2e
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: costdeck-e2e
      - name: Load image
        run: kind load docker-image costdeck-operator:e2e --name costdeck-e2e
      - name: Smoke test
        run: IMAGE=costdeck-operator:e2e ./hack/e2e-smoke.sh
